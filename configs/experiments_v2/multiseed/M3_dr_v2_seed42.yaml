defaults:
- /train/tuned
- /env/realant
experiment:
  name: M3_dr_v2_seed42
  description: PPO + 3-phase curriculum DR with tuned hyperparameters (seed=42)
  tags:
  - M3
  - dr
  - v2_tuned
  - seed42
env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_domain_randomization: true
sr2l:
  enabled: false
domain_randomization:
  enabled: true
  use_curriculum: true
  wrapper_type: CurriculumDRWrapper
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.1
    max_dropped_joints: 1
    min_dropped_joints: 1
    sensor_noise_std: 0.01
  phase_3_config:
    joint_dropout_prob: 0.2
    max_dropped_joints: 2
    min_dropped_joints: 1
    sensor_noise_std: 0.02
total_timesteps: 32000000
logging:
  wandb: true
  wandb_project: robust-quadruped-rl-v2
  wandb_tags:
  - M3_dr_v2
  - tuned_hyperparams
  - seed42
seed: 42
