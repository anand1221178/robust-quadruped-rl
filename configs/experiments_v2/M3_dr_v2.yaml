# M3 v2 - Domain Randomization only (actuator failure robustness)
# Tuned hyperparameters from Andrychowicz et al. (2020)
# 3-phase curriculum: clean -> single failures -> multi failures
defaults:
- /train/tuned
- /env/realant

experiment:
  name: M3_dr_v2
  description: "PPO + 3-phase curriculum DR with tuned hyperparameters"
  tags:
  - M3
  - dr
  - v2_tuned

env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_domain_randomization: true

sr2l:
  enabled: false

domain_randomization:
  enabled: true
  use_curriculum: true
  wrapper_type: CurriculumDRWrapper

  # Phase timing (durations, not cumulative)
  phase_1_steps: 10000000   # 0-10M: clean locomotion foundation
  phase_2_steps: 10000000   # 10-20M: single joint failures
  phase_3_steps: 12000000   # 20-32M: multiple joint failures

  phase_1_config:
    joint_dropout_prob: 0.0
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0

  phase_2_config:
    joint_dropout_prob: 0.10
    max_dropped_joints: 1
    min_dropped_joints: 1
    sensor_noise_std: 0.01

  phase_3_config:
    joint_dropout_prob: 0.20
    max_dropped_joints: 2
    min_dropped_joints: 1
    sensor_noise_std: 0.02

total_timesteps: 32000000

logging:
  wandb: true
  wandb_project: robust-quadruped-rl-v2
  wandb_tags:
  - M3_dr_v2
  - tuned_hyperparams
