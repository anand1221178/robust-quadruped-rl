defaults:
  - /train/default
  - /env/realant

# V7.10D SYMMETRIC TRAINING (FIXED) - V7.10C with corrected curriculum
# Fixes the min_dropped_joints issue to ensure constant failure training in phases 2-3.
experiment:
  name: v7_10d_symmetric_training_fixed
  description: "V7.10c with fixed curriculum - min_dropped_joints=1 in failure phases"

env:
  use_success_reward: true
  use_domain_randomization: true

  # EXACT V7.7E rewards
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0

  # EXACT V7.7E ultra speed mode
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15

  # SYMMETRIC TRAINING FEATURES from V7.10C
  symmetric_training:
    enabled: true
    random_initial_yaw: true
    yaw_range: [-180, 180]
    bidirectional_mode: true
    reward_both_directions: true
    mirror_joint_pairs: true
    paired_joints:
      - [ankle_1, ankle_2]
      - [ankle_3, ankle_4]
      - [hip_1, hip_2]
      - [hip_3, hip_4]
    symmetric_failure_sampling: true
    randomize_observation_frame: true
    frame_randomization_prob: 0.5

# CORRECTED V7.7E curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  phase_1_steps: 10000000
  phase_2_steps: 12000000
  phase_3_steps: 10000000

  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0

  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1  # CORRECTED
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    use_symmetric_sampling: true

  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1  # CORRECTED
    max_dropped_joints: 2
    sensor_noise_std: 0.0
    prefer_paired_failures: true

# EXACT V7.7E training duration
total_timesteps: 32000000
save_freq: 1000000

# EXACT V7.7E hyperparameters
ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

# EXACT V7.7E network
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# EXACT V7.7E rewards
reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.10d", "symmetric-training", "fixed-curriculum", "ankle-parity", "32M-steps"]
