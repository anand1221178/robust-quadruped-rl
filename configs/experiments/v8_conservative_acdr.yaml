# V8 Conservative ACDR - Gentler Adaptation Learning
# Dialed-back V8 settings for more stable learning

defaults:
  - /train/default
  - /env/realant

experiment:
  name: v8_conservative_acdr
  description: "V8 Conservative ACDR: Gentler adaptation-focused learning with stable progression"
  tags: ["v8", "conservative", "acdr", "stable", "adaptation"]

# Same 60M training but with gentler approach
total_timesteps: 60_000_000

ppo:
  learning_rate: 0.0003
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  activation: tanh  # Proven stable for robustness training
  hidden_sizes: [64, 128]

env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_domain_randomization: true
  wrapper_type: "V8EnhancedACDRWrapper"

  # V8 Conservative Configuration - Dialed back for stability
  v8_enhanced_acdr:
    total_timesteps: 60_000_000

    # Three-phase progressive curriculum (GENTLER SETTINGS)
    curriculum_phases:
      phase_1:
        name: "Single Joint Mastery - Conservative"
        duration_steps: 20_000_000       # 20M steps for single joint mastery
        joint_patterns: ["single_joint"]
        k_range: [0.8, 0.4]             # Same Hard→Easy progression
        episode_length: 500              # GENTLER: 500 vs 1000 steps
        failure_probability: 0.5         # GENTLER: 50% vs 80% failure rate

      phase_2:
        name: "Dual Joint Compensation - Conservative"
        duration_steps: 20_000_000       # 20M steps for complex patterns
        joint_patterns: ["dual_adjacent", "dual_diagonal"]
        k_range: [0.6, 0.2]             # Moderate→Severe failures
        episode_length: 750              # GENTLER: 750 vs 1200 steps
        failure_probability: 0.4         # GENTLER: 40% vs 70% failure rate

      phase_3:
        name: "Sequential Dynamic Adaptation - Conservative"
        duration_steps: 20_000_000       # 20M steps for dynamic learning
        joint_patterns: ["sequential_failure"]
        k_range: [0.8, 0.0]             # Complete failures possible
        episode_length: 1000             # GENTLER: 1000 vs 1500 steps
        failure_probability: 0.3         # GENTLER: 30% vs 60% failure rate

    # Conservative ankle specialization (addresses V7 ankle weakness gently)
    ankle_specialization:
      enabled: true
      phase_1_ankle_focus: 0.2          # GENTLER: 20% vs 40% ankle focus
      ankle_reward_multiplier: 1.5      # GENTLER: 1.5x vs 2x rewards
      ankle_adaptation_bonus: 30.0      # GENTLER: 30 vs 50 bonus

    # Gentler adaptation-focused reward design
    adaptation_rewards:
      base_forward: 100.0               # Standard forward motion reward
      adaptation_bonus: 30.0            # GENTLER: 30 vs 50 adaptation bonus
      stability_bonus: 20.0             # GENTLER: 20 vs 25 stability bonus
      efficiency_bonus: 20.0            # GENTLER: 20 vs 25 efficiency bonus
      gait_discovery_bonus: 50.0        # GENTLER: 50 vs 75 discovery bonus

    # Conservative failure injection
    failure_injection:
      dynamic_failures: true            # Still inject failures mid-episode
      adaptation_grace_period: 300      # GENTLER: 300 vs 200 grace steps
      failure_announcement: true        # Signal to robot that failure occurred

# Training infrastructure
training:
  max_episode_steps: 1000              # Match longest conservative episodes
  save_freq: 1_000_000                 # Save every 1M steps
  eval_freq: 2_000_000                 # Evaluate every 2M steps
  eval_episodes: 10

  patience: 10_000_000                 # Allow long plateaus
  min_improvement: 0.01                # Small improvements valuable

# Monitoring and logging
logging:
  wandb: true
  wandb_project: "V8_Conservative_ACDR"
  wandb_entity: "anandpatel1221178-university-of-the-witswatersrand"

wandb:
  enabled: true
  entity: anandpatel1221178-university-of-the-witswatersrand
  project: "V8_Conservative_ACDR"
  tags: ["v8", "conservative", "acdr", "stable", "gentle"]

  log_frequency: 1000
  custom_metrics:
    - "curriculum_phase"
    - "current_k_value"
    - "joint_failure_pattern"
    - "adaptation_reward_bonus"
    - "ankle_specialization_active"
    - "sequential_failure_count"
    - "episode_velocity_improvement"

# Resources
cluster:
  time_limit: "72:00:00"               # 72 hours for 60M steps
  memory: "32GB"
  cpus: 16
  gpu: true

# Success criteria for V8 Conservative
success_criteria:
  target_baseline_velocity: 0.18       # Maintain good baseline performance
  target_joint_failure_retention: 0.5  # 50% average retention across joints
  target_ankle_retention: 0.4          # 40% retention for ankle joints (more realistic)
  target_adaptation_improvement: 0.2    # 20% velocity improvement over episode

# Research notes
research_notes: |
  V8 Conservative ACDR Goals:

  GENTLER APPROACH to V8 Enhanced:
  - Shorter episodes (500-1000 vs 1000-1500) for stable learning
  - Lower failure rates (30-50% vs 60-80%) for less aggressive training
  - Reduced ankle focus (20% vs 40%) to avoid overwhelming early learning
  - Smaller reward bonuses to avoid destabilizing base locomotion

  Expected vs V8 Enhanced:
  - More stable training progression
  - Better baseline locomotion preservation
  - Gentler adaptation learning curve
  - Higher success probability

  Target Improvements over V7:
  - Ankle retention: 19.9-33.9% → 40%+ (vs V8's 50%+ target)
  - Overall success: 77% → 80%+ (vs V8's 85%+ target)
  - Baseline speed: Maintain 0.18+ m/s with better adaptation than V7