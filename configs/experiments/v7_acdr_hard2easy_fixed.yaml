defaults:
  - /train/default
  - /env/realant

# V7 ACDR Hard2Easy - FIXED VERSION
# Addresses identified issues with original implementation
experiment:
  name: v7_acdr_hard2easy_fixed
  description: "V7 ACDR - Fixed Hard2easy curriculum with sensible parameters"

# Environment configuration
env:
  use_success_reward: true
  use_v7_acdr: true

# V7 ACDR FIXED Parameters
v7_acdr:
  curriculum_type: hard2easy
  # FIXED: Start challenging but not impossible (60-80% joint strength)
  initial_L: 0.6          # Hard but robot can still move
  initial_U: 0.8          # Range of moderate impairments
  # FIXED: Realistic end targets (0-20% joint strength)
  target_L: 0.0           # Complete failures at end
  target_U: 0.2           # Severe impairments
  # FIXED: Faster curriculum progression
  update_step: 0.02       # 2x faster than original (0.01)
  # FIXED: Shorter adaptation window
  performance_window: 50  # Half of original (100)
  performance_threshold: null
  verbose: true

# Training parameters
total_timesteps: 20000000  # 20M steps (shorter than original)
save_freq: 500000

# PPO hyperparameters (optimized for curriculum learning)
ppo:
  learning_rate: 0.00022
  batch_size: 512
  clip_range: 0.2
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy network
policy:
  activation: tanh
  hidden_sizes: [64, 64]

# Environment settings
num_envs: 8
seed: 42

# Reward configuration
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0

# Logging
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
    - v7
    - acdr
    - hard2easy
    - fixed
    - curriculum-dr

# Evaluation
eval_freq: 10000