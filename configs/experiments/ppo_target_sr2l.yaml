# SR2L with TargetWalkingWrapper (WORKING APPROACH)
# Sensor noise robustness with goal-directed behavior

defaults:
  - /train/default
  - /env/realant

experiment:
  name: ppo_target_sr2l
  description: "SR2L with proven TargetWalkingWrapper - sensor noise robustness + A-to-B locomotion"
  tags:
    - ppo
    - sr2l
    - target_walking
    - sensor_noise_robustness
    - working_approach

# Enable SR2L with TANH ACTIVATION (NaN fix)
sr2l:
  enabled: true
  lambda_smooth: 0.001          # Gentle regularization
  perturbation_std: 0.01        # Small sensor noise (1%)
  max_perturbation: 0.05        # Cap maximum perturbation
  warmup_steps: 5000000         # 5M step warmup to maintain goal-directed behavior
  curriculum_steps: 15000000    # 15M curriculum phase
  perturb_only_joints: true     # Only perturb joint observations (dims 13-28)
  joint_start_dim: 13           # Start of joint obs in RealAnt
  joint_end_dim: 28             # End of joint obs  
  use_curriculum: true          # Gradual introduction

# Environment settings - USE PROVEN TARGETWALKINGWRAPPER
env:
  name: RealAntMujoco-v0
  use_success_reward: false           # NO speed-only rewards
  use_target_walking: true            # PROVEN goal-directed wrapper
  use_smooth_target_walking: false    # NO broken smooth wrapper
  target_distance: 5.0                # 5m targets
  use_domain_randomization: false

# Disable other methods
domain_randomization:
  enabled: false

permanent_dr:
  enabled: false

# PPO settings - LOWER LR for fine-tuning
ppo:
  learning_rate: 0.0001               # Lower LR since fine-tuning
  n_steps: 2048
  batch_size: 64                      # Smaller batches for SR2L stability
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - TANH ACTIVATION (critical for SR2L!)
policy:
  hidden_sizes: [64, 128]
  activation: tanh              # Bounded outputs prevent NaN crashes!

# Training settings - FINE-TUNING from working baseline
total_timesteps: 20000000       # 20M steps for fine-tuning
num_envs: 8
seed: 42

# LOAD FROM WORKING BASELINE (proven 0.220 m/s with targets)
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
vec_normalize_path: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_target_sr2l"
  verbose: 1

# Save settings
save_freq: 100000
eval_freq: 10000
n_eval_episodes: 5

# EXPECTED OUTCOME:
# - Maintains 0.2+ m/s walking speed
# - Continues reaching targets every ~21s
# - Adds sensor noise robustness on top
# - No NaN crashes (tanh activation)