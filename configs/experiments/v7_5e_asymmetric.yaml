defaults:
  - /train/default
  - /env/realant

# V7.5E - ASYMMETRIC CURRICULUM
# Different progression rates for hip vs ankle joints
experiment:
  name: v7_5e_asymmetric
  description: "V7.5E - Asymmetric curriculum: Ankles train harder than hips"

env:
  use_success_reward: true
  use_domain_randomization: true

# HIGH DUAL FAILURE FOCUS - Ankles are harder so train with more failures
domain_randomization:
  enabled: true
  joint_dropout_prob: 0.5  # 50% failure rate
  min_dropped_joints: 2    # ALWAYS 2 joints fail
  max_dropped_joints: 2    # Focus on dual failures
  sensor_noise_std: 0.0

total_timesteps: 35000000  # 35M steps
save_freq: 1000000

ppo:
  learning_rate: 0.00011
  batch_size: 1664
  n_epochs: 9
  gamma: 0.993
  gae_lambda: 0.96
  clip_range: 0.18
  ent_coef: 0.008
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.1
  # Extra rewards for ankle compensation (since they're harder)
  ankle_compensation_bonus: 1.5  # 50% more reward for walking with failed ankles
  hip_compensation_bonus: 1.0    # Normal reward for hip failures

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5e", "asymmetric", "ankle-focus", "joint-specific"]