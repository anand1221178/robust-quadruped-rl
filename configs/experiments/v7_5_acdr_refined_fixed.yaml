defaults:
  - /train/default
  - /env/realant

# V7.5 ACDR Refined - The Goldilocks Model
# FIXED version using the corrected V7ACDRWrapperFixed
experiment:
  name: v7_5_acdr_refined_fixed
  description: "FIXED V7.5 ACDR - Sweet spot between V7 and V8, using raw rewards"

# Environment configuration - USE THE FIXED WRAPPER
env:
  use_success_reward: true
  use_v7_acdr_fixed: true  # USE THE CORRECTED WRAPPER

# V7.5 REFINED ACDR Parameters - Better than V7, simpler than V8
v7_acdr:
  curriculum_type: hard2easy
  initial_L: 0.85
  initial_U: 0.95
  target_L: 0.25
  target_U: 0.4
  update_step: 0.006
  performance_window: 175
  performance_threshold: 0.175
  verbose: true

# Training parameters
total_timesteps: 35000000
save_freq: 1000000

# PPO hyperparameters
ppo:
  learning_rate: 0.00008
  batch_size: 1536
  clip_range: 0.15
  n_epochs: 8
  gamma: 0.994
  gae_lambda: 0.965
  ent_coef: 0.006
  vf_coef: 0.5
  max_grad_norm: 0.35

# Policy network
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# Environment settings
num_envs: 8
seed: 42

# Reward configuration
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.15

# Logging
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
    - v7.5-fixed
    - acdr
    - refined
    - raw-reward-fix

# Evaluation
eval_freq: 10000
