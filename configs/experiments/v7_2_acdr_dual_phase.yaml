defaults:
  - /train/default
  - /env/realant

# V7.2 ACDR Dual-Phase Training - Foundation + Robustness
# Focus: Explicit foundation building followed by robustness development
experiment:
  name: v7_2_acdr_dual_phase
  description: "V7.2 ACDR - Dual-phase training: foundation establishment then robustness building"

# Environment configuration
env:
  use_success_reward: true
  use_v7_acdr: true

# V7.2 DUAL-PHASE ACDR Parameters
v7_acdr:
  curriculum_type: hard2easy
  # PHASE 1 (0-15M steps): Foundation Building
  # Start with minimal impairment, focus on achieving 0.22+ m/s
  initial_L: 0.9          # Nearly perfect joints (90-98% strength)
  initial_U: 0.98         # Almost no failures at start

  # PHASE 2 (15-30M steps): Robustness Building
  # Transition to moderate failures while maintaining speed
  target_L: 0.4           # Moderate final failures
  target_U: 0.6           # Challenging but not extreme

  # DUAL-PHASE: Adaptive progression with phase transitions
  update_step: 0.008      # Moderate progression rate
  performance_window: 150 # Balanced adaptation window

  # DUAL-PHASE: Phase-specific performance requirements
  performance_threshold: 0.19  # Require good performance before advancing
  phase_1_target: 0.21    # Must achieve near-baseline in phase 1
  phase_2_minimum: 0.17   # Acceptable trade-off in phase 2
  verbose: true

# Training parameters - Extended for dual-phase approach
total_timesteps: 30000000  # 30M steps for full dual-phase training
save_freq: 500000

# PPO hyperparameters - Balanced for both phases
ppo:
  learning_rate: 0.00015  # Moderate learning rate
  batch_size: 768         # Balanced batch size
  clip_range: 0.18        # Moderate clipping
  n_epochs: 5             # Good learning without overfitting
  gamma: 0.993            # Good long-term planning
  gae_lambda: 0.96        # Balanced advantage estimation
  ent_coef: 0.008         # Moderate exploration
  vf_coef: 0.5
  max_grad_norm: 0.4      # Moderate gradient clipping

# Policy network - Enhanced capacity for dual objectives
policy:
  activation: tanh
  hidden_sizes: [128, 96]  # Asymmetric network for complexity

# Environment settings
num_envs: 8
seed: 42

# Reward configuration - Dual-phase reward adaptation
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.3       # Higher speed emphasis for foundation
  robustness_weight: 0.7  # Secondary robustness objective
  adaptive_weights: true  # Adjust weights during training

# Logging
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
    - v7.2
    - acdr
    - dual-phase
    - foundation-robustness
    - extended-training

# Evaluation
eval_freq: 10000