defaults:
  - /train/default
  - /env/realant

# V7.3 ACDR Multi-Objective with Smart Rewind - Advanced Training
# Focus: Explicit speed+robustness optimization with curriculum rewind mechanism
experiment:
  name: v7_3_acdr_multi_objective
  description: "V7.3 ACDR - Multi-objective optimization with smart curriculum rewind and performance monitoring"

# Environment configuration
env:
  use_success_reward: true
  use_v7_acdr: true

# V7.3 MULTI-OBJECTIVE ACDR Parameters
v7_acdr:
  curriculum_type: hard2easy
  # MULTI-OBJECTIVE: Conservative start with intelligent progression
  initial_L: 0.85         # Good starting point (85-92% joint strength)
  initial_U: 0.92         # Strong initial performance

  # MULTI-OBJECTIVE: Moderate end targets with rewind capability
  target_L: 0.35          # Moderate but challenging failures
  target_U: 0.55          # Balanced difficulty

  # SMART PROGRESSION: Adaptive curriculum with rewind mechanism
  update_step: 0.01       # Moderate progression
  performance_window: 120 # Balanced adaptation

  # MULTI-OBJECTIVE: Performance monitoring and rewind
  performance_threshold: 0.18     # Minimum acceptable performance
  rewind_threshold: 0.16          # If below this, rewind curriculum
  rewind_steps: 2                 # Number of curriculum steps to rewind
  consolidation_period: 1000000   # 1M steps at easier level after rewind

  # MULTI-OBJECTIVE: Explicit objective weights
  speed_weight: 0.7               # Primary objective: maintain speed
  robustness_weight: 0.3          # Secondary: build robustness
  adaptive_curriculum: true       # Enable smart curriculum adaptation
  verbose: true

# Training parameters - Extended for sophisticated training
total_timesteps: 35000000  # 35M steps for advanced multi-objective training
save_freq: 500000

# PPO hyperparameters - Optimized for multi-objective learning
ppo:
  learning_rate: 0.00012  # Slightly lower for stability with complex objectives
  batch_size: 1024        # Large batches for stable multi-objective gradients
  clip_range: 0.16        # Conservative clipping for stability
  n_epochs: 6             # More epochs for complex objective learning
  gamma: 0.994            # High gamma for long-term multi-objective planning
  gae_lambda: 0.97        # High lambda for better advantage estimates
  ent_coef: 0.006         # Moderate exploration for complex search space
  vf_coef: 0.6            # Higher value function weight for stability
  max_grad_norm: 0.35     # Tight gradient control for multi-objective

# Policy network - Larger capacity for multi-objective complexity
policy:
  activation: tanh
  hidden_sizes: [256, 128, 64]  # Deeper network for complex objectives

# Environment settings
num_envs: 8
seed: 42

# Reward configuration - Advanced multi-objective reward
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.4       # Strong speed emphasis
  robustness_weight: 0.8  # Meaningful robustness component
  adaptive_weights: true  # Dynamic weight adjustment
  performance_bonus: 0.2  # Bonus for maintaining both objectives
  failure_penalty: 0.1    # Small penalty for complete failures

# Logging - Enhanced for multi-objective monitoring
logging:
  verbose: 1
  log_interval: 50        # More frequent logging for complex training
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
    - v7.3
    - acdr
    - multi-objective
    - smart-rewind
    - advanced-curriculum
    - performance-monitoring

# Evaluation - More frequent for complex training
eval_freq: 5000