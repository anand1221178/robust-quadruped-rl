defaults:
  - /train/default
  - /env/realant

# V7.8E SYMMETRY ENFORCEMENT - Ultra Speed + symmetric joint training
# Trains symmetric joint pairs together for better generalization
experiment:
  name: v7_8e_symmetry_enforcement
  description: "Ultra Speed + symmetric joint pair training for better generalization"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # ULTRA SPEED BASE (from V7.7e)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15
  # NEW: Symmetric joint training
  use_symmetric_training: true
  symmetric_config:
    # Define symmetric pairs
    joint_pairs:
      - [0, 2]  # hip_1, hip_2 (front hips)
      - [4, 6]  # hip_3, hip_4 (rear hips)
      - [1, 3]  # ankle_1, ankle_2 (front ankles)
      - [5, 7]  # ankle_3, ankle_4 (rear ankles)
    # Probability of failing both joints in a pair
    symmetric_failure_prob: 0.5
    # Cross-body pairs for diagonal training
    diagonal_pairs:
      - [0, 6]  # hip_1, hip_4 (diagonal hips)
      - [2, 4]  # hip_2, hip_3 (diagonal hips)
    diagonal_failure_prob: 0.3
  # Symmetry reward bonus
  use_symmetry_reward: true
  symmetry_bonus: 1.2  # Bonus for maintaining symmetric gait

# Modified curriculum for symmetric training
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 2  # Allow pairs in phase 2
    sensor_noise_std: 0.0
    use_symmetric_mode: true
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 2
    max_dropped_joints: 2  # Focus on pairs
    sensor_noise_std: 0.0
    use_symmetric_mode: true

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0
  gait_symmetry_weight: 0.5  # Reward symmetric gaits

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.8e", "symmetry-enforcement", "pair-training", "ultra-speed-base"]