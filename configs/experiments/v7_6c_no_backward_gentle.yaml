defaults:
  - /train/default
  - /env/realant

# V7.6C - NO BACKWARD (GENTLE)
# Takes the best model (V7.5C Progressive) and adds a gentle penalty for backward walking.
experiment:
  name: v7_6c_no_backward_gentle
  description: "V7.5C Progressive + Gentle BackwardPenaltyWrapper (2x penalty) - encourages forward without paralyzing exploration"

env:
  use_success_reward: true
  use_domain_randomization: true
  # GENTLE PENALTY: 2x instead of 5x
  # This creates the gradient: forward (+reward) > stationary (0) > backward (-2x penalty)
  # Without being so harsh that the robot fears all movement
  use_backward_penalty: true
  backward_penalty_multiplier: 2.0  # Gentle discouragement, not punishment

# Using the same successful progressive curriculum from V7.5C
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.1
  mastery_bonus: 50.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.6c", "gentle-backward-penalty", "2x", "progressive-mastery", "exploration-friendly"]