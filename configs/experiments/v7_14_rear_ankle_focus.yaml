# V7.14 - REAR ANKLE FOCUS SPECIALIST
# Building on V7.13's success to target the isolated rear ankle problem
# 50% rear ankle focus (25% ankle_3 + 25% ankle_4) with proven methodology
# Fresh normalization + gentle approach that eliminated backward walking

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: v7_14_rear_ankle_focus
  description: "Targeted rear ankle improvement building on V7.13 success - 50% rear ankle training"
  tags: ["v7.14", "rear_ankle_specialist", "ankle_3", "ankle_4", "iterative_improvement"]

# PRETRAINED MODEL BASE - V7.13 Success (NO VecNormalize!)
pretrained_model: "/home-mscluster/panand/Research Proj/robust-quadruped-rl/experiments/v7_13_fresh_normalization_57ea0nls/final_model.zip"
# pretrained_vec_normalize: INTENTIONALLY OMITTED - Fresh normalization approach

# Environment setup (identical to V7.13 - keep what works!)
env:
  name: RealAntMujoco-v0
  use_success_reward: true

  # V7.7E backward penalty (proven effective)
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0

  # V7.7E ultra speed mode (drives high baseline performance)
  use_ultra_speed_mode: true
  speed_bonus_multiplier: 3.0
  speed_bonus_threshold: 0.1
  target_velocity: 0.15
  velocity_retention_bonus: true

  # NO rotation mastery (failed in V7.11)
  use_rotation_mastery: false

# Domain randomization - REAR ANKLE FOCUSED curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  # Extended training for challenging rear ankle problem
  phase_1_steps: 10000000  # 10M steps rear ankle specialization
  phase_2_steps: 5000000   # 5M steps validation
  phase_3_steps: 0

  # Phase 1: REAR ANKLE FOCUSED - 50% rear ankle training
  phase_1_config:
    joint_dropout_prob: 0.4  # Higher failure rate for more training
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0

    # 🎯 REAR ANKLE SPECIALIZATION WEIGHTS
    joint_weights:
      # REAR ANKLES - Primary focus (50% total)
      ankle_3: 0.25    # 25% ankle_3 (rear-left propulsion)
      ankle_4: 0.25    # 25% ankle_4 (rear-right propulsion)

      # FRONT ANKLES - Reduced (already working well)
      ankle_1: 0.05    # 5% ankle_1 (was 34.2% in V7.13)
      ankle_2: 0.05    # 5% ankle_2 (was 48.8% in V7.13)

      # HIPS - Maintain competency (40% total - already excellent)
      hip_1: 0.10      # 10% hip_1 (was 79.4% in V7.13)
      hip_2: 0.10      # 10% hip_2 (was 43.0% in V7.13)
      hip_3: 0.10      # 10% hip_3
      hip_4: 0.10      # 10% hip_4 (was 38.7% in V7.13)

  # Phase 2: Normal validation sampling
  phase_2_config:
    joint_dropout_prob: 0.3
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.01

# Extended training for rear ankle challenge
total_timesteps: 15000000  # 15M steps (increased from 12M)
save_freq: 1000000

# PPO settings (same as successful V7.13)
ppo:
  learning_rate: 0.0001      # Same as V7.13
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

# Same policy as V7.7E/V7.13
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# V7.7E reward configuration (proven successful)
reward_config:
  mastery_bonus: 100.0
  speed_weight: 1.5
  survival_bonus: 0.5
  use_modified_reward: true

# Logging
log_freq: 10000
eval_freq: 1000000
eval_episodes: 10

# W&B
wandb:
  enabled: true
  entity: anand_patel_robust_rl_research
  project: robust-quadruped-rl
  tags: ["v7.14", "rear_ankle_focus", "iterative_improvement", "final_attempt"]
  name: v7_14_rear_ankle_focus