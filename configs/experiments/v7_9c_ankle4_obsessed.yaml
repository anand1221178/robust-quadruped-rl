defaults:
  - /train/default
  - /env/realant

# V7.9C ANKLE_4 OBSESSED - EXTREME ankle_4 specialization training
# Philosophy: If you can walk with ankle_4 disabled, you can walk with anything disabled
# 83% of training dedicated to ankle_4 mastery
experiment:
  name: v7_9c_ankle4_obsessed
  description: "EXTREME ankle_4 specialist - 25M steps of ankle_4 failure training with nuclear reward shaping"

env:
  use_success_reward: true
  use_domain_randomization: true

  # EXTREME backward penalty for ankle_4 specialist
  use_backward_penalty: true
  backward_penalty_multiplier: 20.0  # NUCLEAR - 20x penalty for moving backward

  # ULTRA SPEED BASE (proven to work)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15

  # EXTENDED EPISODES (same as V7.9a/b)
  max_episode_steps: 2500  # 50 seconds for complex ankle_4 strategies

  # EXTREME ANKLE_4 ROTATION REWARDS
  use_rotation_rewards: true
  rotation_config:
    # Enhanced rotation detection for ankle_4
    track_body_orientation: true
    rotation_detection_window: 50   # Faster detection for ankle_4

    # NUCLEAR rotation rewards for ankle_4
    rotation_speed_bonus: 5.0       # 5x reward for rotating quickly when ankle_4 fails
    rotation_angle_thresholds:
      - angle: 30   # degrees - Early reward for starting rotation
        bonus: 2.0
      - angle: 90   # Quarter turn
        bonus: 4.0
      - angle: 180  # Full turn
        bonus: 8.0  # MASSIVE reward for completing ankle_4 strategy
      - angle: 270  # Over-rotation
        bonus: 6.0  # Still good if it helps

    # ANKLE_4 OBSESSED joint targets
    joint_rotation_targets:
      ankle_4: 180  # PRIMARY TARGET - full rotation for ankle_4
      ankle_3: 90   # Secondary targets
      ankle_2: 45
      ankle_1: 0    # Front joints don't need rotation
      hip_4: 180    # Support ankle_4 strategy
      hip_3: 90
      hip_2: 45
      hip_1: 0

    # EXTREME bonus for ankle_4 specific strategies
    ankle_4_specialist_rewards:
      pivot_strategy_bonus: 3.0      # Reward pivoting on ankle_4
      tripod_stance_bonus: 2.5       # Reward stable 3-leg walking
      lateral_shuffle_bonus: 2.0     # Reward side-stepping
      stability_maintenance: 4.0     # HUGE reward for not falling with ankle_4 disabled

    # Movement while rotating (ankle_4 specific)
    rotation_with_movement_bonus: 3.0  # 3x bonus for moving while turning with ankle_4 disabled

# EXTREME ANKLE_4 CURRICULUM - 83% ankle_4 training!
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 5000000   # 5M steps - Learn basic walking quickly
  phase_2_steps: 25000000  # 25M steps - ANKLE_4 OBSESSION PHASE (83% of training!)
  phase_3_steps: 5000000   # 5M steps - Mixed validation

  phase_1_config:
    # Pure walking - no failures (build foundation quickly)
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0

  phase_2_config:
    # ANKLE_4 OBSESSION - 90% of failures are ankle_4!
    joint_dropout_prob: 0.9  # 90% of episodes have failures
    min_dropped_joints: 1
    max_dropped_joints: 1     # Only single joint failures for focus
    sensor_noise_std: 0.0

    # EXTREME ankle_4 weighting
    joint_weights:
      ankle_4: 20.0    # 20x more likely than any other joint!
      ankle_3: 2.0     # Secondary targets
      hip_4: 2.0
      ankle_2: 1.0
      hip_3: 1.0
      hip_2: 0.5       # Less focus on easier joints
      ankle_1: 0.5
      hip_1: 0.2       # Minimal focus on easiest joint

  phase_3_config:
    # Mixed validation - test all joints
    joint_dropout_prob: 0.7
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0
    # Equal weighting for final validation

total_timesteps: 35000000  # 35M steps total
save_freq: 1000000

# Optimized hyperparameters for ankle_4 learning
ppo:
  learning_rate: 0.00005   # Lower LR for stable ankle_4 learning
  batch_size: 2048         # Larger batches for stable gradients
  n_epochs: 10             # More epochs for ankle_4 mastery
  gamma: 0.998             # Higher discount for long-term ankle_4 strategies
  gae_lambda: 0.98         # Higher lambda for ankle_4 sequence learning
  clip_range: 0.2          # Standard clipping
  ent_coef: 0.01           # Higher entropy for ankle_4 exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  activation: tanh         # Proven to work with rotation rewards
  hidden_sizes: [256, 256] # Larger network for complex ankle_4 strategies

# EXTREME reward shaping for ankle_4
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0              # Higher survival bonus
  speed_weight: 2.0                # 2x speed importance
  mastery_bonus: 200.0             # 2x mastery bonus for ankle_4 success
  rotation_reward_weight: 3.0      # 3x rotation reward weight
  ankle_4_specialist_weight: 5.0   # 5x weight for ankle_4 specific rewards

num_envs: 16  # More environments for ankle_4 data collection
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.9c", "ankle4-obsessed", "extreme-specialist", "nuclear-rewards", "35M-steps"]