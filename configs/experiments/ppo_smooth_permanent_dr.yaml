# Permanent DR + Smooth Goal-Directed Locomotion
# Permanent joint disabilities with ACTUAL A-to-B goals!

defaults:
  - /train/default
  - /env/realant

experiment:
  name: ppo_smooth_permanent_dr
  description: "Permanent DR with smooth goal-directed locomotion - permanent disability adaptation with A-to-B behavior"
  tags:
    - ppo
    - permanent_dr
    - smooth_target_walking
    - disability_adaptation
    - goal_directed

# Enable permanent DR
permanent_dr:
  enabled: true
  failure_rate: 0.001             # 0.1% chance per step of NEW permanent failure
  max_failed_joints: 4            # Up to 4 joints can permanently fail
  warmup_steps: 8000000           # 8M steps learning smooth goals first
  curriculum_steps: 20000000      # 20M steps gradual permanent failures
  start_failures: 0               # Start with no failures
  end_failures: 4                 # End with up to 4 permanent failures
  verbose: false

# Environment settings - SMOOTH + GOAL-DIRECTED
env:
  name: RealAntMujoco-v0
  use_success_reward: false           # NO speed-only rewards
  use_target_walking: false           # NO jerky version
  use_smooth_target_walking: true     # SMOOTH goal-directed version!
  target_distance: 5.0                # 5m targets
  use_permanent_dr: true              # Enable permanent DR wrapper
  use_domain_randomization: false

# Disable other methods
sr2l:
  enabled: false

domain_randomization:
  enabled: false

# PPO settings
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 2048                # Larger batches for stability
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01                  # Small entropy for exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture
policy:
  hidden_sizes: [64, 128]
  activation: relu

# Training settings - LONGEST FOR HARDEST TASK
total_timesteps: 60000000       # 60M steps - hardest task needs most time!
num_envs: 8
seed: 42

# No pretrained model - new obs space
pretrained_model: null
vec_normalize_path: null

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_smooth_permanent_dr"
  verbose: 1

# Save settings
save_freq: 100000
eval_freq: 50000                # Less frequent eval for speed

# EXPECTED OUTCOME:
# - Robot learns to walk A to B with 4 permanently failed joints
# - Develops new gaits when joints fail forever
# - Maintains goal-directed behavior even with severe disabilities
# - True adaptive locomotion (like prosthetics for quadrupeds)