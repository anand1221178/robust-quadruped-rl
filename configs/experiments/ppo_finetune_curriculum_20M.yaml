
defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ppo_finetune_curriculum_20M
  description: "NUCLEAR ROBUSTNESS: Fine-tune from baseline with gentle curriculum DR (20M steps)"


pretrained_model: "done/ppo_baseline_ueqbjf2x/best_model/best_model.zip"
pretrained_vec_normalize: "done/ppo_baseline_ueqbjf2x/vec_normalize.pkl"

# Domain randomization configuration
domain_randomization:
  enabled: true
  wrapper_type: CurriculumDRWrapper
  use_curriculum: true
  
  # 🟢 PHASE 1: Gentle adaptation (10M steps)
  phase_1_steps: 10000000
  phase_1_config:
    joint_dropout_prob: 0.01     # 1% chance - ultra-gentle start
    max_dropped_joints: 1        # Single joint only
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.003      # Tiny noise
    noise_joints_only: true
  
  # ⚡ PHASE 2: Moderate robustness (10M steps)  
  phase_2_steps: 10000000
  phase_2_config:
    joint_dropout_prob: 0.03     # 3% chance
    max_dropped_joints: 2        # Up to 2 joints
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.008      # Mild noise
    noise_joints_only: true

# Override PPO for fine-tuning
ppo:
  learning_rate: 0.00005         # 🔥 ULTRA-LOW for gentle fine-tuning
  clip_range: 0.1               # Smaller clips for stability

# Override training parameters
total_timesteps: 20000000        # 20M steps fine-tuning
save_freq: 500000               # Save every 500K steps

# Override logging for this specific experiment
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100