# V7.12 - GENTLE ANKLE SPECIALIST
# Balanced fine-tuning from V7.7E champion to improve ankle_4
# 30% ankle_4 focus (not 70% like failed V7.11) with 40% hip preservation
# NO rotation mastery - just weighted sampling with proven rewards

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: v7_12_gentle_ankle_specialist
  description: "Gentle ankle_4 specialization from V7.7E - balanced 30% focus to avoid overspecialization"
  tags: ["v7.12", "gentle_specialist", "ankle_4", "balanced", "fine_tuning"]

# PRETRAINED MODEL BASE - V7.7E Champion (cluster paths)
pretrained_model: "/home-mscluster/panand/Research Proj/robust-quadruped-rl/experiments/v7_7e_ultra_speed_jtfwl2qf/final_model.zip"
pretrained_vec_normalize: "/home-mscluster/panand/Research Proj/robust-quadruped-rl/experiments/v7_7e_ultra_speed_jtfwl2qf/vec_normalize.pkl"

# Environment setup (same as V7.7E - KEEP WHAT WORKS!)
env:
  name: RealAntMujoco-v0
  use_success_reward: true

  # V7.7E backward penalty (proven to work)
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0

  # V7.7E ultra speed mode - EXACT SAME CONFIGURATION!
  use_ultra_speed_mode: true
  speed_bonus_multiplier: 3.0
  speed_bonus_threshold: 0.1
  target_velocity: 0.15
  velocity_retention_bonus: true

  # NO ROTATION MASTERY - That failed catastrophically
  use_rotation_mastery: false

# Domain randomization - BALANCED weighted curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  # 2-phase gentle training
  phase_1_steps: 8000000   # 8M steps balanced specialization
  phase_2_steps: 4000000   # 4M steps validation
  phase_3_steps: 0         # No phase 3

  # Phase 1: BALANCED ankle_4 focus (not 70% like V7.11!)
  phase_1_config:
    joint_dropout_prob: 0.35  # Moderate failure rate
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0

    # 🎯 BALANCED JOINT SAMPLING - THE KEY DIFFERENCE!
    joint_weights:
      # Primary focus but not overwhelming
      ankle_4: 0.30    # 30% ankle_4 (vs 70% in failed V7.11)

      # Other ankles to maintain general ankle robustness
      ankle_1: 0.10    # 10% ankle_1
      ankle_2: 0.10    # 10% ankle_2
      ankle_3: 0.10    # 10% ankle_3

      # CRITICAL: Keep hips working to maintain locomotion!
      hip_1: 0.10      # 10% hip_1
      hip_2: 0.10      # 10% hip_2
      hip_3: 0.10      # 10% hip_3
      hip_4: 0.10      # 10% hip_4

  # Phase 2: Normal validation
  phase_2_config:
    joint_dropout_prob: 0.25
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.01
    # No weights - random sampling for validation

# Training parameters (gentle fine-tuning from V7.7E)
total_timesteps: 12000000  # 12M steps
save_freq: 1000000

# PPO settings for fine-tuning (closer to V7.7E but with low LR)
ppo:
  learning_rate: 0.00005     # Ultra-low LR for fine-tuning
  batch_size: 1536           # Match V7.7E
  n_epochs: 8                # Match V7.7E
  gamma: 0.995               # Match V7.7E
  gae_lambda: 0.97           # Match V7.7E
  clip_range: 0.15           # Match V7.7E
  ent_coef: 0.005            # Match V7.7E
  vf_coef: 0.5               # Match V7.7E
  max_grad_norm: 0.4         # Match V7.7E

# Same policy as V7.7E
policy:
  activation: tanh           # Match V7.7E exactly
  hidden_sizes: [128, 128]   # Match V7.7E exactly

# V7.7E reward configuration
reward_config:
  mastery_bonus: 100.0
  speed_weight: 1.5
  survival_bonus: 0.5
  use_modified_reward: true

# Logging
log_freq: 10000
eval_freq: 1000000
eval_episodes: 10

# W&B
wandb:
  enabled: true
  entity: anand_patel_robust_rl_research
  project: robust-quadruped-rl
  tags: ["v7.12", "gentle_specialist", "balanced_curriculum", "ankle_4"]
  name: v7_12_gentle_ankle_specialist