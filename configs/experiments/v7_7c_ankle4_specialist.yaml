defaults:
  - /train/default
  - /env/realant

# V7.7C ANKLE4 SPECIALIST - Extra focus on the worst performing joint
# 30% of training episodes will have Ankle_4 failed (joint 7)
experiment:
  name: v7_7c_ankle4_specialist
  description: "Specialized training for Ankle_4 failure - the worst performer at 2.8%"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep successful 5x penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # NEW: Ankle_4 specialization
  use_ankle4_specialization: true
  ankle4_failure_rate: 0.3  # 30% of episodes have Ankle_4 failed
  ankle4_bonus_multiplier: 1.5  # Extra reward when walking with Ankle_4 failed

# Modified curriculum with Ankle_4 emphasis
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    # Bias toward rear ankle failures
    joint_weights: [1, 1, 1, 2, 1, 2, 1, 3]  # 3x weight on joint 7 (Ankle_4)
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0
    joint_weights: [1, 1, 1, 2, 1, 2, 1, 3]

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.1
  mastery_bonus: 75.0  # Higher bonus for mastering hard Ankle_4

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.7c", "ankle4-specialist", "worst-case-focus", "targeted"]