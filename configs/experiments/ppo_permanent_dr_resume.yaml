# Resume Permanent DR Training after 24h timeout
# Continue from checkpoint after cluster time limit

defaults:
  - /train/base
  - /env/realant

experiment:
  name: ppo_permanent_dr_resume
  description: "Resume Permanent DR training after 24h cluster timeout"
  tags:
    - ppo
    - permanent_dr
    - resume
    - checkpoint_continue

# Enable permanent DR
permanent_dr:
  enabled: true
  failure_rate: 0.001         # Same as before
  max_failed_joints: 4       
  warmup_steps: 2000000        # Already completed
  curriculum_steps: 15000000   # Already in progress
  start_failures: 0          
  end_failures: 4            
  verbose: false             

# SR2L disabled
sr2l:
  enabled: false

# Standard DR disabled
domain_randomization:
  enabled: false

# Environment settings
env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_permanent_dr: true
  use_domain_randomization: false

# REMAINING timesteps - 33.6M completed, 6.4M to go  
total_timesteps: 6400000  # Remaining steps (40M - 33.6M)

# PPO hyperparameters (same as before)
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture
policy:
  hidden_sizes: [64, 128]
  activation: relu

# LOAD from latest checkpoint (33.6M steps completed)
pretrained_model: experiments/ppo_permanent_dr_nkexs2mj/checkpoints/model_33600000_steps.zip
vec_normalize_path: experiments/ppo_permanent_dr_nkexs2mj/checkpoints/model_vecnormalize_33600000_steps.pkl

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_permanent_dr_resume"
  verbose: 1

# Save settings  
save_freq: 100000
eval_freq: 50000

# Notes:
# - This resumes from checkpoint after 24h cluster timeout
# - Adjust total_timesteps based on actual progress
# - Update pretrained_model path to latest checkpoint
# - Should continue exactly where it left off