# 🎲 NUCLEAR OPTION 3A: Simple Non-Curriculum with CurriculumDRWrapper (40M steps)
# Approach: Use CurriculumDRWrapper but with single constant phase
# Theory: Maybe curriculum phases were the problem, not DR itself

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_simple_curriculum_40M
  description: "NUCLEAR ROBUSTNESS: Simple constant DR using CurriculumDRWrapper (40M steps)"

# 🎯 SINGLE-PHASE "CURRICULUM" (CONSTANT DR FOR 40M)
domain_randomization:
  use_curriculum: true
  wrapper_type: CurriculumDRWrapper
  
  # 🟢 PHASE 1: Short clean learning (5M steps)
  phase_1_steps: 5000000
  phase_1_config:
    joint_dropout_prob: 0.0      # Clean learning first
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0
    noise_joints_only: true
  
  # 🎲 PHASE 2: Constant gentle DR (35M steps)  
  phase_2_steps: 35000000
  phase_2_config:
    joint_dropout_prob: 0.03     # 3% constant throughout
    max_dropped_joints: 1        # Single joint max
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.006      # Mild constant noise
    noise_joints_only: true

# 🧠 PPO Configuration (proven working from baseline)
ppo:
  learning_rate: 0.0003          # Standard rate
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 40000000        # 40M steps total
checkpoint_freq: 1000000         # Save every 1M steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["curriculum-wrapper", "simple-dr", "constant", "40M-steps", "nuclear-option"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 3A: Simple constant DR using CurriculumDRWrapper"