defaults:
  - /train/default
  - /env/realant

# Systematic Curriculum V3 - INTERLEAVED APPROACH + REWARD FIX
# Key innovation: 70:30 interleaved episodes + norm_reward=False

algorithm: PPO
experiment:
  name: ppo_systematic_curriculum_v3_interleaved
  description: |
    REVOLUTIONARY V3 INTERLEAVED SYSTEMATIC CURRICULUM
    - Phase 0 (0-10M): 100% normal walking foundation
    - Phase 1 (10M-34M): 70% normal + 30% single joint failures (interleaved)
    - Phase 2 (34M-64M): 70% normal + 30% dual joint failures (interleaved)
    - Key innovations: Interleaved episodes + reward normalization fix
    - Hypothesis: Interleaving prevents skill forgetting while building robustness

# Environment Configuration
env:
  name: RealAntMujoco-v0
  use_success_reward: true

# Number of parallel environments
num_envs: 8

# CRITICAL V3 FIX: Disable reward normalization
vec_normalize:
  enabled: true
  norm_obs: true
  norm_reward: false  # 🔥 THE CRITICAL FIX - preserve raw reward incentives
  clip_obs: 10.0

# Train from scratch (clean start)
pretrained_model: null
pretrained_vec_normalize: null

# PPO Hyperparameters (optimized for interleaved training)
ppo:
  learning_rate: 3.0e-04  # Standard learning rate
  n_steps: 2048
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005  # 🎯 Lower entropy - interleaving provides diversity
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy Network Configuration
policy:
  type: MlpPolicy
  activation: relu
  hidden_sizes:
    - 64
    - 128

# V3 INTERLEAVED Systematic Curriculum Configuration
systematic_curriculum:
  enabled: true

  # Phase 0: Foundation learning (unchanged)
  normal_walking_duration: 10000000  # 10M steps - pure normal walking

  # V3 INNOVATION: Interleaved training phases
  interleave_mode: "episode"     # Episode-based interleaving
  normal_episode_ratio: 0.7      # 70% normal walking episodes
  failure_episode_ratio: 0.3     # 30% joint failure episodes

  # Phase 1: Single joint mastery (10M-34M steps) - INTERLEAVED
  single_joint_duration: 3000000  # 3M steps per joint, but interleaved
  # Each joint gets 3M steps total, but spread across 70:30 episodes
  # Actual failure episodes per joint: 3M × 0.3 = 900k failure episodes
  # Normal episodes during each joint: 3M × 0.7 = 2.1M normal episodes

  # Phase 2: Dual combinations (34M-64M steps) - INTERLEAVED
  dual_combo_duration: 3000000    # 3M steps per combination, interleaved
  # Each combination gets 3M steps total: 900k failure + 2.1M normal

  # V3 INTERLEAVING: Maintains systematic progression but with normal episodes mixed in
  # Joint order maintained: hip_1, ankle_1, hip_2, ankle_2, etc.
  # But each 3M step period has 70% normal walking, 30% that specific failure

  # Anatomical combinations (complete limb failures)
  anatomical_combinations:
    - [hip_1, ankle_1]      # Front left leg
    - [hip_2, ankle_2]      # Front right leg
    - [hip_3, ankle_3]      # Rear left leg
    - [hip_4, ankle_4]      # Rear right leg

  # Diagonal combinations (cross-body coordination)
  diagonal_combinations:
    - [hip_1, hip_4]        # Front left + rear right
    - [hip_2, hip_3]        # Front right + rear left

  # Functional combinations (same joint types)
  functional_combinations:
    - [hip_1, hip_2]        # Both front hips
    - [hip_3, hip_4]        # Both rear hips
    - [ankle_1, ankle_2]    # Both front ankles
    - [ankle_3, ankle_4]    # Both rear ankles

  # V3 Episode Management
  episode_selection:
    method: "random_weighted"  # Randomly select episode type based on ratio
    seed_based: true          # Use episode number seed for reproducibility

  # Phase 3: Not implemented yet
  triple_combo_duration: 0
  critical_triple_combinations: []

# Total Training Steps
total_timesteps: 64000000  # 64M steps total

# Checkpointing Configuration
checkpoints:
  save_freq: 1000000  # Save every 1M steps
  save_best: true
  save_last: true
  save_phase_transitions: true

# Logging Configuration
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl-v3-interleaved
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand

  # Track interleaving effectiveness
  custom_metrics:
    - curriculum/current_phase
    - curriculum/failed_joints
    - curriculum/pattern_type
    - curriculum/episode_type        # normal vs failure
    - curriculum/interleave_ratio    # actual ratio achieved
    - robot/x_position
    - robot/height
    - robot/velocity_ms
    - robot/total_distance
    - rewards/raw_custom_reward     # Track raw rewards
    - rewards/episode_return
    - performance/locomotion_speed
    - performance/baseline_retention
    - performance/normal_episode_performance  # Performance on normal episodes
    - performance/failure_episode_performance # Performance on failure episodes

# Evaluation Configuration
eval_freq: 500000
evaluation:
  episodes: 10
  deterministic: true
  render: false

# Random Seed for Reproducibility
seed: 42

# Research Configuration
research:
  hypothesis: |
    V3 HYPOTHESIS: Interleaved curriculum (70% normal, 30% failures) will:
    - Prevent skill forgetting by maintaining normal walking practice
    - Build robustness through systematic failure exposure
    - Achieve BETTER performance than pure systematic (V4) or probabilistic approaches
    - Maintain >0.18 m/s throughout all phases due to continuous normal practice

  expected_outcomes:
    - "Phase 0: Achieve ~0.22 m/s baseline performance (foundation)"
    - "Phase 1: Maintain ~0.20-0.22 m/s average (90-100% retention)"
    - "Phase 2: Maintain ~0.18-0.20 m/s average (80-90% retention)"
    - "Failure episodes: Graceful degradation to ~0.15 m/s"
    - "Normal episodes: Maintain ~0.22 m/s throughout training"

  success_criteria:
    - "Average performance >0.18 m/s in Phase 1 (interleaved benefit)"
    - "Average performance >0.16 m/s in Phase 2 (robustness + skill preservation)"
    - "Normal episodes maintain >0.20 m/s throughout (skill preservation)"
    - "Failure episodes achieve >0.12 m/s (robustness building)"
    - "Superior to both V4 (pure systematic) and probabilistic approaches"

# V3 Specific Innovations
v3_innovations:
  - "70:30 interleaved episodes prevent catastrophic forgetting"
  - "Systematic progression maintained with skill preservation"
  - "Lower entropy coefficient leverages interleaving diversity"
  - "Episode-based interleaving for clean phase management"
  - "Dual performance tracking (normal vs failure episodes)"
  - "Reward normalization fix preserves incentive structure"
  - "Revolutionary approach combining systematic + continual learning"

# Advanced V3 Features
advanced_features:
  skill_preservation:
    enabled: true
    normal_episode_target: 0.7  # 70% normal episodes
    performance_monitoring: true

  robustness_building:
    enabled: true
    systematic_progression: true
    failure_episode_target: 0.3  # 30% failure episodes

  curriculum_balancing:
    method: "episode_weighted"
    preserve_total_failure_exposure: true  # Each failure type still gets full exposure
    maintain_systematic_order: true       # Joint order preserved