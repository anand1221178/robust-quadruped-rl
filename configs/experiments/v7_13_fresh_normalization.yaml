# V7.13 - FRESH NORMALIZATION SPECIALIST
# CRITICAL FIX: Use V7.7E pretrained weights but NOT its VecNormalize statistics
# The weighted curriculum changes observation distribution - old stats are toxic!
# This should fix the backward walking pathology seen in V7.12

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: v7_13_fresh_normalization
  description: "Fresh VecNormalize statistics for weighted curriculum - fixes V7.12 backward walking"
  tags: ["v7.13", "fresh_normalize", "ankle_4", "final_attempt"]

# CRITICAL CHANGE: Pretrained model WITHOUT VecNormalize!
pretrained_model: "/home-mscluster/panand/Research Proj/robust-quadruped-rl/experiments/v7_7e_ultra_speed_jtfwl2qf/final_model.zip"
# pretrained_vec_normalize: REMOVED! This was poisoning our training!

# Environment setup (identical to V7.12)
env:
  name: RealAntMujoco-v0
  use_success_reward: true

  # V7.7E backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0

  # V7.7E ultra speed mode
  use_ultra_speed_mode: true
  speed_bonus_multiplier: 3.0
  speed_bonus_threshold: 0.1
  target_velocity: 0.15
  velocity_retention_bonus: true

  # NO rotation mastery
  use_rotation_mastery: false

# Domain randomization - SAME weighted curriculum as V7.12
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  # 2-phase training (identical to V7.12)
  phase_1_steps: 8000000   # 8M steps balanced specialization
  phase_2_steps: 4000000   # 4M steps validation
  phase_3_steps: 0

  # Phase 1: Balanced ankle_4 focus (same as V7.12)
  phase_1_config:
    joint_dropout_prob: 0.35
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0

    # Same balanced weighting as V7.12
    joint_weights:
      ankle_4: 0.30    # 30% ankle_4 focus
      ankle_1: 0.10    # 10% ankle_1
      ankle_2: 0.10    # 10% ankle_2
      ankle_3: 0.10    # 10% ankle_3
      hip_1: 0.10      # 10% hip_1
      hip_2: 0.10      # 10% hip_2
      hip_3: 0.10      # 10% hip_3
      hip_4: 0.10      # 10% hip_4

  # Phase 2: Normal validation
  phase_2_config:
    joint_dropout_prob: 0.25
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.01

# Training parameters (same as V7.12)
total_timesteps: 12000000
save_freq: 1000000

# PPO settings - SLIGHTLY higher LR since we need to adapt to new statistics
ppo:
  learning_rate: 0.0001      # Increased from 5e-5 to help adapt to new normalization
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

# Same policy as V7.7E
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# V7.7E reward configuration
reward_config:
  mastery_bonus: 100.0
  speed_weight: 1.5
  survival_bonus: 0.5
  use_modified_reward: true

# Logging
log_freq: 10000
eval_freq: 1000000
eval_episodes: 10

# W&B
wandb:
  enabled: true
  entity: anand_patel_robust_rl_research
  project: robust-quadruped-rl
  tags: ["v7.13", "fresh_normalization", "vecnorm_fix", "final_ankle4_attempt"]
  name: v7_13_fresh_normalization