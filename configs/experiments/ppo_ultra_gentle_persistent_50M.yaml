# 🔥 NUCLEAR OPTION 1B: Ultra-Long Gentle Persistent DR (50M steps)
# Approach: DomainRandomizationWrapper with ultra-gentle progression
# Theory: Simple persistent DR with ultra-gentle settings

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_ultra_gentle_persistent_50M
  description: "NUCLEAR ROBUSTNESS: Ultra-long gentle persistent DR with DomainRandomizationWrapper (50M steps)"

# 🎯 ULTRA-GENTLE PERSISTENT DR (50M TOTAL)
domain_randomization:
  use_curriculum: false
  wrapper_type: DomainRandomizationWrapper
  
  # 🔥 ULTRA-GENTLE SETTINGS (constant throughout training)
  joint_dropout_prob: 0.02      # 2% chance - ultra-gentle
  max_dropped_joints: 1         # Single joint max
  min_dropped_joints: 0         # 🔥 OPTIONAL failures!
  sensor_noise_std: 0.005       # Ultra-mild noise
  noise_joints_only: true

# 🧠 PPO Configuration (proven working from baseline)
ppo:
  learning_rate: 0.0003          # Standard rate for stability
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 50000000        # 50M steps - MASSIVE training time
checkpoint_freq: 1000000         # Save every 1M steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["persistent-dr", "ultra-gentle", "50M-steps", "nuclear-option"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 1B: Ultra-long gentle persistent DR with DomainRandomizationWrapper"