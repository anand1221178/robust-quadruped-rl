defaults:
  - /train/default
  - /env/realant

# Systematic Curriculum V3 - Single Environment Approach
# SIMPLE SOLUTION: Use SystematicCurriculumWrapper from start with proper 10M Phase 0

algorithm: PPO
experiment:
  name: ppo_systematic_curriculum_v3_single_env
  description: |
    V3 SYSTEMATIC CURRICULUM - SINGLE ENVIRONMENT APPROACH
    - Same environment throughout: SystematicCurriculumWrapper from step 0
    - Phase 0 (0-10M): Normal walking in curriculum environment
    - Phase 1 (10M-34M): Single joint failure training
    - Phase 2 (34M-64M): Dual joint failure combinations
    - Key fix: No environment switching = no observation mismatch = no NaN

# NO PHASE SWITCHING - Single environment throughout
phase_switching:
  enabled: false  # V3: No switching, same environment throughout

# Environment Configuration
env:
  name: RealAntMujoco-v0
  use_success_reward: true

# Number of parallel environments
num_envs: 8

# Use VecNormalize
use_vec_normalize: true

# Load pretrained model and VecNormalize from baseline
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
pretrained_vec_normalize: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl

# PPO Hyperparameters (fine-tuning configuration)
ppo:
  learning_rate: 5.0e-05  # Ultra-low for fine-tuning
  n_steps: 2048
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy Network Configuration
policy:
  type: MlpPolicy
  activation: relu
  hidden_sizes:
    - 64
    - 128

# Systematic Curriculum Configuration (ACTIVE FROM START)
systematic_curriculum:
  enabled: true

  # V3 FIX: Proper 10M Phase 0 in same environment
  normal_walking_duration: 10000000  # 10M steps normal walking

  # Phase 1: Single joint mastery (10M-34M steps)
  single_joint_duration: 3000000  # 3M steps per joint × 8 joints = 24M total

  # Phase 2: Dual combinations (34M-64M steps)
  dual_combo_duration: 3000000    # 3M steps per combination × 10 combos = 30M total

  # Anatomical combinations (complete limb failures)
  anatomical_combinations:
    - [hip_1, ankle_1]      # Front left leg
    - [hip_2, ankle_2]      # Front right leg
    - [hip_3, ankle_3]      # Rear left leg
    - [hip_4, ankle_4]      # Rear right leg

  # Diagonal combinations (cross-body coordination)
  diagonal_combinations:
    - [hip_1, hip_4]        # Front left + rear right
    - [hip_2, hip_3]        # Front right + rear left

  # Functional combinations (same joint types)
  functional_combinations:
    - [hip_1, hip_2]        # Both front hips
    - [hip_3, hip_4]        # Both rear hips
    - [ankle_1, ankle_2]    # Both front ankles
    - [ankle_3, ankle_4]    # Both rear ankles

  # Phase 3: Triple combinations (disabled for now)
  triple_combo_duration: 0
  critical_triple_combinations: []

# Total Training Steps
total_timesteps: 64000000  # 64M steps total: 10M Phase 0 + 54M curriculum

# Checkpointing Configuration
checkpoints:
  save_freq: 1000000  # Save every 1M steps
  save_best: true
  save_last: true

# Logging Configuration
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl-v3
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand

  # Custom metrics to track
  custom_metrics:
    - curriculum/current_phase
    - curriculum/failed_joints
    - curriculum/pattern_type
    - robot/x_position
    - robot/height
    - robot/velocity_ms
    - robot/total_distance

# Evaluation Configuration
eval_freq: 500000  # Evaluate every 500k steps
evaluation:
  episodes: 10
  deterministic: true
  render: false

# Random Seed for Reproducibility
seed: 42

# Research Configuration
research:
  hypothesis: |
    V3 single environment approach will avoid observation distribution mismatch
    while maintaining systematic curriculum training. Phase 0 (10M steps) in
    curriculum environment should achieve similar baseline performance (~0.20+ m/s)
    before transitioning to joint failure phases.

  expected_outcomes:
    - "Phase 0: Achieve 0.20+ m/s (baseline-level in curriculum environment)"
    - "Phase 1: Maintain 0.18-0.20 m/s (single joint adaptation)"
    - "Phase 2: Achieve 0.15-0.18 m/s (dual joint mastery)"
    - "No NaN crashes: Consistent observation distribution throughout"

  success_criteria:
    - "No neural network failures (NaN errors)"
    - "Phase 0: >85% baseline retention (>0.19 m/s)"
    - "Phase 1: >70% retention for single joints"
    - "Phase 2: >50% retention for dual combinations"
    - "Complete 64M step training without crashes"

# V3 Specific Improvements
v3_improvements:
  - "Single environment approach eliminates observation distribution mismatch"
  - "No complex phase switching callbacks - simple and robust"
  - "Same observation space throughout training ensures VecNormalize compatibility"
  - "SystematicCurriculumWrapper Phase 0 provides baseline-equivalent training"
  - "Guaranteed mathematical stability - no NaN explosion risk"