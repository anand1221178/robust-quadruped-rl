defaults:
  - /train/default
  - /env/realant

algorithm: PPO
checkpoints:
  save_best: true
  save_freq: 1000000
  save_last: true
  save_phase_transitions: true
env:
  name: RealAntMujoco-v0
  use_success_reward: true
eval_freq: 500000
evaluation:
  deterministic: true
  episodes: 10
  test_dual_combinations: true
  test_single_joints: true
  test_untrained_combinations: true
experiment:
  description: 'FIXED SYSTEMATIC CURRICULUM: Added Phase 0 normal walking foundation (64M steps)'
  name: ppo_systematic_curriculum_fixed_64M
logging:
  custom_metrics:
  - curriculum/current_phase
  - curriculum/current_subphase
  - curriculum/failed_joints
  - curriculum/pattern_type
  - curriculum/subphase_progress
  - curriculum/completion_percentage
  - performance/locomotion_speed
  - performance/baseline_retention
  - performance/adaptation_rate
  - performance/stability_metric
  - biomech/gait_asymmetry
  - biomech/joint_utilization
  - biomech/energy_efficiency
  - joints/active_joint_count
  - joints/failed_joint_count
  - joints/compensation_pattern
  log_interval: 100
  tensorboard: true
  verbose: 1
  wandb: true
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_project: robust-quadruped-rl-systematic-fixed
num_envs: 8
policy:
  activation: relu
  hidden_sizes:
  - 64
  - 128
ppo:
  batch_size: 2048
  clip_range: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 5.0e-05
  max_grad_norm: 0.5
  n_epochs: 10
  vf_coef: 0.5
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
pretrained_vec_normalize: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl
research:
  expected_outcomes:
  - Phase 0: Maintain baseline 0.224 m/s performance (10M steps)
  - Phase 1: Single joint adaptation strategies for all 8 joints (24M steps)
  - Phase 2: Pattern-specific adaptation for anatomical/diagonal/functional failures (30M steps)
  - Superior performance vs. previous broken systematic approach
  hypothesis: Fixed systematic curriculum with normal walking foundation will achieve
    70-90% baseline retention for single joints, 50-70% for dual combinations
  success_criteria:
  - 'Phase 0: Maintain >90% of baseline performance (>0.20 m/s)'
  - 'Phase 1: >70% retention for all single joints'
  - 'Phase 2: >50% retention for all dual combinations'
  - 'Overall: Demonstrate systematic > probabilistic robustness'
save_freq: 1000000
seed: 42
systematic_curriculum:
  # Phase 0: Normal walking foundation (NEW!)
  normal_walking_duration: 10000000  # 10M steps - consolidate baseline performance
  
  # Phase 1: Single joint mastery (UNCHANGED)
  single_joint_duration: 3000000     # 3M steps per joint × 8 joints = 24M total
  
  # Phase 2: Dual combinations (UNCHANGED)  
  dual_combo_duration: 3000000       # 3M steps per combination × 10 combos = 30M total
  anatomical_combinations:
  - - hip_1
    - ankle_1
  - - hip_2
    - ankle_2
  - - hip_3
    - ankle_3
  - - hip_4
    - ankle_4
  diagonal_combinations:
  - - hip_1
    - hip_4
  - - hip_2
    - hip_3
  functional_combinations:
  - - hip_1
    - hip_2
  - - hip_3
    - hip_4
  - - ankle_1
    - ankle_2
  - - ankle_3
    - ankle_4
    
  # Phase 3: Triple combinations (UNCHANGED - still 0 for now)
  critical_triple_combinations: []
  triple_combo_duration: 0
  
  enabled: true
  wrapper_type: SystematicCurriculumWrapper
total_timesteps: 64000000  # 64M steps: 10M + 24M + 30M + 0M
training:
  adaptation_analysis: true
  curriculum_logging: true
  curriculum_warmup: 100000
  freeze_value_function: false
  patience: 2000000
  performance_threshold: 0.1