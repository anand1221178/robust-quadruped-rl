# 🎲 NUCLEAR OPTION 3B: Simple Persistent DR (40M steps)
# Hydra config - simple constant DR using DomainRandomizationWrapper

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ppo_simple_persistent_40M
  description: "NUCLEAR ROBUSTNESS: Simple persistent DR with DomainRandomizationWrapper (40M steps)"

# Domain randomization configuration
domain_randomization:
  enabled: true
  wrapper_type: DomainRandomizationWrapper
  use_curriculum: false
  
  # 🔥 SIMPLE CONSTANT SETTINGS
  joint_dropout_prob: 0.03      # 3% chance - constant throughout
  max_dropped_joints: 1         # Single joint max
  min_dropped_joints: 0         # 🔥 OPTIONAL failures!
  sensor_noise_std: 0.006       # Mild constant noise
  noise_joints_only: true

# Override training parameters
total_timesteps: 40000000        # 40M steps total
save_freq: 1000000              # Save every 1M steps

# Override logging for this specific experiment
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100