defaults:
  - /train/default
  - /env/realant

# Experiment settings
experiment:
  description: "PPO + CURRICULUM Persistent DR - Exactly as research proposal"
  name: ppo_curriculum_persistent_dr
  tags: 
    - ppo
    - curriculum-dr
    - persistent-failures
    - research-proposal
    - phase-based-training

# Disable SR2L (this is DR only)
sr2l:
  enabled: false

# Enable Domain Randomization with CURRICULUM (matching research proposal)
domain_randomization:
  enabled: true
  
  # CURRICULUM IMPLEMENTATION (research proposal phases):
  # Phase 1 (0-8M steps): No faults → learn base locomotion  
  # Phase 2 (8-16M steps): Single joint dropout + mild noise
  # Phase 3 (16-25M steps): Multiple dropouts + high noise
  
  # Phase 1: Clean training (0-8M steps)
  phase_1_steps: 8000000
  phase_1_config:
    joint_dropout_prob: 0.0        # No failures - learn base locomotion
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0          # No noise
  
  # Phase 2: Single joint + mild noise (8-16M steps) 
  phase_2_steps: 8000000
  phase_2_config:
    joint_dropout_prob: 0.05       # 5% chance single joint failure
    max_dropped_joints: 1          # Single joint only
    min_dropped_joints: 1
    sensor_noise_std: 0.01         # Mild noise
  
  # Phase 3: Multiple joints + high noise (16-25M steps)
  phase_3_config:
    joint_dropout_prob: 0.15       # 15% chance multiple joint failure
    max_dropped_joints: 2          # Up to 2 joints
    min_dropped_joints: 1
    sensor_noise_std: 0.03         # High noise
    
  noise_joints_only: true          # Only add noise to joint sensors

# Environment settings - MATCH BASELINE EXACTLY
env:
  name: RealAntMujoco-v0
  use_success_reward: true         # Match baseline wrapper exactly
  use_domain_randomization: true   # Enable curriculum DR wrapper

# Total training steps - RESEARCH PROPOSAL TIMELINE
total_timesteps: 25000000          # 25M steps (8M + 8M + 9M phases)

# Initialize from PROVEN BASELINE for faster convergence
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip

# PPO hyperparameters - MATCH BASELINE EXACTLY
ppo:
  learning_rate: 0.0001            # Lower LR for fine-tuning from baseline
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01                   # Small entropy for exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - ReLU works fine with DR
policy:
  hidden_sizes: [64, 128]         # Same as baseline
  activation: relu                # DR doesn't cause NaN like SR2L

# Environment setup
num_envs: 8
seed: 42

# Evaluation settings
eval_freq: 10000                  # Frequent evaluation
save_freq: 100000                 # Save every 100k steps

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_entity: "anandpatel1221178-university-of-the-witswatersrand"
  verbose: 1

# Notes:
# - EXACT research proposal curriculum: Phase 1 (clean) → Phase 2 (single+mild) → Phase 3 (multiple+high)
# - Starts from proven baseline (0.224 m/s) for guaranteed good starting point
# - 25M steps total matching research proposal timeline
# - Should achieve much better performance than previous failed attempt
# - Progressive difficulty ensures robot maintains locomotion while gaining robustness