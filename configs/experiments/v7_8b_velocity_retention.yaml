defaults:
  - /train/default
  - /env/realant

# V7.8B VELOCITY RETENTION - Ultra Speed + retention percentage rewards
# Rewards maintaining speed percentage during failures, not just absolute speed
experiment:
  name: v7_8b_velocity_retention
  description: "Ultra Speed + velocity retention bonuses (80%: 1.5x, 60%: 1.2x, 40%: 1.1x)"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # ULTRA SPEED BASE (from V7.7e)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15
  # NEW: Enhanced velocity retention rewards
  use_retention_tiers: true
  retention_bonus_tiers:
    - threshold: 0.80  # 80% speed retention
      multiplier: 1.5
    - threshold: 0.60  # 60% speed retention
      multiplier: 1.2
    - threshold: 0.40  # 40% speed retention
      multiplier: 1.1
  # Track baseline for retention calculation
  baseline_velocity_tracking: true
  retention_calculation_window: 100  # Steps to average

# Same progressive curriculum as Ultra Speed
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0
  retention_reward_weight: 2.0  # Extra weight for retention rewards

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.8b", "velocity-retention", "percentage-rewards", "ultra-speed-base"]