defaults:
  - /train/default
  - /env/realant

# V7.8F ULTRA SPEED PLUS - Combined best elements from all approaches
# Takes the winning Ultra Speed formula and adds the most promising enhancements
experiment:
  name: v7_8f_ultra_speed_plus
  description: "Ultra Speed + ankle focus + strong anti-backward + retention rewards"

env:
  use_success_reward: true
  use_domain_randomization: true
  # ENHANCED backward penalty (from Forward Progress)
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0  # Stronger than base
  backward_velocity_threshold: -0.005
  # ULTRA SPEED BASE (from V7.7e)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15
  # FROM ANKLE SPECIALIST: Weighted sampling
  use_weighted_joint_sampling: true
  joint_sampling_weights:
    ankle_4: 2.5  # Focus on worst performer
    ankle_3: 2.0
    ankle_1: 1.5
    # Others default to 1.0
  # FROM VELOCITY RETENTION: Retention rewards
  use_retention_tiers: true
  retention_bonus_tiers:
    - threshold: 0.50  # 50% retention gets bonus
      multiplier: 1.3
    - threshold: 0.70  # 70% retention
      multiplier: 1.5
  # FROM FORWARD PROGRESS: Forward bonus
  use_forward_progress_bonus: true
  forward_progress_config:
    min_velocity: 0.01
    base_multiplier: 1.3
  # NEW: Combined mastery system
  use_combined_mastery: true
  mastery_config:
    speed_mastery_threshold: 0.12  # Speed achievement
    robustness_mastery_threshold: 0.50  # Retention achievement
    combined_bonus: 150.0  # Big bonus for both

# Progressive curriculum with slight ankle focus
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    ankle_bias: 0.6  # 60% chance for ankle failures
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.4  # Balanced survival
  speed_weight: 1.8  # High speed focus
  mastery_bonus: 150.0  # Combined mastery bonus
  retention_weight: 1.5  # Value retention
  forward_weight: 1.3  # Value forward progress

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.8f", "ultra-speed-plus", "combined-best", "ankle-focus", "anti-backward"]