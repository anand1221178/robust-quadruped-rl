# V7 ACDR Easy2Hard Curriculum - Comparison Configuration
# This is the TRADITIONAL approach that the paper shows FAILS
# Created for scientific comparison to prove hard2easy superiority

defaults:
  - /train/default
  - /env/realant

experiment:
  name: v7_acdr_easy2hard
  description: "V7 ACDR - Easy2hard curriculum (expected to fail based on research)"

# Environment configuration
env:
  use_success_reward: true
  use_v7_acdr: true

# V7 ACDR Parameters - EASY2HARD VERSION
v7_acdr:
  curriculum_type: easy2hard  # WARNING: Paper shows this fails!

  # Start with PERFECT WALKING (traditional approach)
  initial_L: 1.5  # Start with mild enhancement
  initial_U: 1.5  # No failures initially

  # End with DEAD JOINTS (causes catastrophic forgetting!)
  target_L: 0.0   # k=0 means joint completely dead
  target_U: 0.0   # Worst case at END of training

  # Adaptive parameters (same as hard2easy for fair comparison)
  update_step: 0.01
  performance_window: 100
  performance_threshold: null

  verbose: true

# PPO Hyperparameters (same as hard2easy for fair comparison)
ppo:
  learning_rate: 0.00022
  n_epochs: 4
  batch_size: 512
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy Network
policy:
  hidden_sizes: [64, 64]
  activation: tanh

# Training Configuration
total_timesteps: 25_000_000
num_envs: 8
eval_freq: 10000
save_freq: 500000

# Reward Configuration
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0

# Logging
logging:
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7", "acdr", "easy2hard", "comparison", "expected-failure"]
  log_interval: 100
  verbose: 1

seed: 42

# Expected Performance (from paper):
# - Average Reward: ~600 (50% of hard2easy)
# - Catastrophic forgetting at end of training
# - Robot learns stationary behavior
# - Similar failure pattern to our V1-V5 approaches