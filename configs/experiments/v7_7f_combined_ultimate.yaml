defaults:
  - /train/default
  - /env/realant

# V7.7F COMBINED ULTIMATE - All enhancements together
# Joint-specific + Speed bonus + Progressive + Ankle4 focus
experiment:
  name: v7_7f_combined_ultimate
  description: "Ultimate combo: Joint-specific penalties + speed bonus + progressive + ankle focus"

env:
  use_success_reward: true
  use_domain_randomization: true
  # COMBINED FEATURES
  # 1. Joint-specific penalties
  use_backward_penalty: true
  use_joint_specific_penalties: true
  hip_backward_penalty: 3.0
  ankle_backward_penalty: 6.0    # Even harsher for problematic ankles

  # 2. Speed bonus system
  use_speed_bonus: true
  speed_bonus_threshold: 0.11
  speed_bonus_multiplier: 2.5

  # 3. Progressive penalty
  use_progressive_penalty: true
  initial_penalty_mult: 0.8      # Start at 80% of base penalties
  final_penalty_mult: 1.2        # End at 120% of base penalties
  penalty_ramp_steps: 25000000

  # 4. Stationary penalty
  stationary_penalty: -0.4       # Harsh stationary penalty
  stationary_threshold: 0.05

  # 5. Ankle4 special attention
  ankle4_bonus_multiplier: 2.0   # Double reward for Ankle4 success

# Enhanced curriculum with all features
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    joint_weights: [1, 1, 1, 1.5, 1, 1.5, 1, 2]  # Bias toward rear ankles
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0
    joint_weights: [1, 1, 1, 1.5, 1, 1.5, 1, 2]

total_timesteps: 35000000  # Slightly longer for complexity
save_freq: 1000000

ppo:
  learning_rate: 0.00008  # Slightly lower for stability with complex rewards
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.006
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.8
  speed_weight: 1.3
  mastery_bonus: 75.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.7f", "combined-ultimate", "all-features", "kitchen-sink"]