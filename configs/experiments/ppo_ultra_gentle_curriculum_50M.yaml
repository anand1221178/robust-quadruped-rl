# 🔥 NUCLEAR OPTION 1A: Ultra-Long Gentle Curriculum DR (50M steps)
# Hydra config - overrides defaults from /train/default and /env/realant

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ppo_ultra_gentle_curriculum_50M
  description: "NUCLEAR ROBUSTNESS: Ultra-long gentle curriculum with CurriculumDRWrapper (50M steps)"

# Domain randomization configuration
domain_randomization:
  enabled: true
  wrapper_type: CurriculumDRWrapper
  use_curriculum: true
  
  # 🟢 PHASE 1: Ultra-long clean training (20M steps)
  phase_1_steps: 20000000
  phase_1_config:
    joint_dropout_prob: 0.0      # ZERO failures - perfect learning
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0        # ZERO noise - clean signals
    noise_joints_only: true
  
  # ⚡ PHASE 2: Ultra-gentle single failures (15M steps)  
  phase_2_steps: 15000000
  phase_2_config:
    joint_dropout_prob: 0.02     # 2% chance (ultra-gentle!)
    max_dropped_joints: 1        # Single joint only
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.005      # Ultra-mild noise
    noise_joints_only: true
  
  # 🚀 PHASE 3: Gentle multiple failures (15M steps)
  phase_3_config:
    joint_dropout_prob: 0.05     # 5% chance (gentle!)
    max_dropped_joints: 2        # Up to 2 joints
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.01       # Mild noise
    noise_joints_only: true

# Override training parameters
total_timesteps: 50000000        # 50M steps - MASSIVE training time
save_freq: 1000000              # Save every 1M steps

# Override logging for this specific experiment
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100