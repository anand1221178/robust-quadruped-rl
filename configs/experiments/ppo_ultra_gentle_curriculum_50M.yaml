# 🔥 NUCLEAR OPTION 1A: Ultra-Long Gentle Curriculum DR (50M steps)
# Approach: CurriculumDRWrapper with ultra-gentle progression
# Theory: More time in each phase = stronger learning

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_ultra_gentle_curriculum_50M
  description: "NUCLEAR ROBUSTNESS: Ultra-long gentle curriculum with CurriculumDRWrapper (50M steps)"

# 🎯 ULTRA-GENTLE 3-PHASE CURRICULUM (50M TOTAL)
domain_randomization:
  use_curriculum: true
  wrapper_type: CurriculumDRWrapper
  
  # 🟢 PHASE 1: Ultra-long clean training (20M steps vs 8M before)
  phase_1_steps: 20000000
  phase_1_config:
    joint_dropout_prob: 0.0      # ZERO failures - perfect learning
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0        # ZERO noise - clean signals
    noise_joints_only: true
  
  # ⚡ PHASE 2: Ultra-gentle single failures (15M steps)  
  phase_2_steps: 15000000
  phase_2_config:
    joint_dropout_prob: 0.02     # 2% chance (vs 3% before - EVEN GENTLER!)
    max_dropped_joints: 1        # Single joint only
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.005      # Ultra-mild noise
    noise_joints_only: true
  
  # 🚀 PHASE 3: Gentle multiple failures (15M steps)
  phase_3_config:
    joint_dropout_prob: 0.05     # 5% chance (vs 8% before - GENTLER!)
    max_dropped_joints: 2        # Up to 2 joints
    min_dropped_joints: 0        # 🔥 OPTIONAL failures!
    sensor_noise_std: 0.01       # Mild noise
    noise_joints_only: true

# 🧠 PPO Configuration (proven working from baseline)
ppo:
  learning_rate: 0.0003          # Standard rate for stability
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 50000000        # 50M steps - MASSIVE training time
checkpoint_freq: 1000000         # Save every 1M steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["curriculum-dr", "ultra-gentle", "50M-steps", "nuclear-option"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 1A: Ultra-long gentle curriculum with CurriculumDRWrapper"