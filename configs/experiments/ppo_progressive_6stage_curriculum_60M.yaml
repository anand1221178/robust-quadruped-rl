# 🚀 NUCLEAR OPTION 4A: Multi-Stage Progressive Curriculum (60M steps) 
# Hydra config - ultra-gradual 3-phase curriculum progression

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ppo_progressive_6stage_curriculum_60M
  description: "NUCLEAR ROBUSTNESS: Ultra-gradual 3-phase curriculum progression (60M steps)"

# Domain randomization configuration
domain_randomization:
  enabled: true
  wrapper_type: CurriculumDRWrapper
  use_curriculum: true
  
  # 🟢 PHASE 1: Perfect learning (20M steps)
  phase_1_steps: 20000000
  phase_1_config:
    joint_dropout_prob: 0.0      # ZERO failures
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0        # ZERO noise
    noise_joints_only: true
  
  # 🔹 PHASE 2: Ultra-gentle introduction (20M steps)
  phase_2_steps: 20000000
  phase_2_config:
    joint_dropout_prob: 0.005    # 0.5% chance - ULTRA gentle
    max_dropped_joints: 1
    min_dropped_joints: 0        # 🔥 OPTIONAL!
    sensor_noise_std: 0.001      # Tiny noise
    noise_joints_only: true
  
  # 🔸 PHASE 3: Very gentle (20M steps)
  phase_3_config:
    joint_dropout_prob: 0.01     # 1% chance
    max_dropped_joints: 1
    min_dropped_joints: 0        # 🔥 OPTIONAL!
    sensor_noise_std: 0.003      # Very mild noise
    noise_joints_only: true

# Override training parameters
total_timesteps: 60000000        # 60M steps - MAXIMUM training
save_freq: 1000000              # Save every 1M steps

# Override logging for this specific experiment
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100