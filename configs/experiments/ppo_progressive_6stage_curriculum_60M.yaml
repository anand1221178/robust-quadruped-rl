# 🚀 NUCLEAR OPTION 4A: Multi-Stage Progressive Curriculum (60M steps) 
# Approach: 6-stage ultra-gradual curriculum progression
# Theory: MAXIMUM gradual progression prevents any training collapse

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_progressive_6stage_curriculum_60M
  description: "NUCLEAR ROBUSTNESS: 6-stage ultra-gradual curriculum progression (60M steps)"

# 🎯 ULTRA-GRADUAL 6-PHASE CURRICULUM (60M TOTAL)
domain_randomization:
  use_curriculum: true
  wrapper_type: CurriculumDRWrapper
  
  # 🟢 PHASE 1: Perfect learning (15M steps)
  phase_1_steps: 15000000
  phase_1_config:
    joint_dropout_prob: 0.0      # ZERO failures
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0        # ZERO noise
    noise_joints_only: true
  
  # 🔹 PHASE 2: Tiny introduction (10M steps)
  phase_2_steps: 10000000
  phase_2_config:
    joint_dropout_prob: 0.005    # 0.5% chance - ULTRA gentle
    max_dropped_joints: 1
    min_dropped_joints: 0        # 🔥 OPTIONAL!
    sensor_noise_std: 0.001      # Tiny noise
    noise_joints_only: true
  
  # 🔸 PHASE 3: Very gentle (10M steps)
  phase_3_config:
    joint_dropout_prob: 0.01     # 1% chance
    max_dropped_joints: 1
    min_dropped_joints: 0        # 🔥 OPTIONAL!
    sensor_noise_std: 0.003      # Very mild noise
    noise_joints_only: true
    
  # Note: Additional phases will be defined in a custom 6-stage curriculum wrapper
  # This config template shows the concept - actual implementation needs 6-stage wrapper

# 🧠 PPO Configuration (proven working)
ppo:
  learning_rate: 0.0003          # Standard rate
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 60000000        # 60M steps - MAXIMUM training
checkpoint_freq: 1000000         # Save every 1M steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["6-stage-curriculum", "ultra-gradual", "60M-steps", "maximum-overkill"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 4A: 6-stage ultra-gradual curriculum (MAXIMUM OVERKILL)"