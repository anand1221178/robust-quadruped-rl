defaults:
  - /train/default
  - /env/realant

# V7.9A EXTENDED EPISODES - EXACT V7.7e config with ONLY episode length changed
experiment:
  name: v7_9a_extended_episodes
  description: "V7.7e Ultra Speed EXACT config with 2500-step episodes for complete rotation"

# EXACT SAME env settings as V7.7e (from done/dr/Curr best/v7_7e_ultra_speed_jtfwl2qf/config.yaml)
env:
  use_success_reward: true
  use_domain_randomization: true
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.1  # Exact value from V7.7e
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15

  # THE ONLY ADDITION - LONGER EPISODES!
  max_episode_steps: 2500  # 50 seconds instead of default 20 seconds

# EXACT domain_randomization from V7.7e
domain_randomization:
  enabled: true
  wrapper_type: CurriculumDRWrapper
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

# EXACT ppo settings from V7.7e
ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

# EXACT policy from V7.7e
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# EXACT reward_config from V7.7e
reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0

# EXACT training settings from V7.7e
total_timesteps: 32000000
save_freq: 1000000
num_envs: 8
seed: 42
eval_freq: 10000

# EXACT logging from V7.7e
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.9a", "extended-episodes", "2500-steps", "v7.7e-exact"]
  tensorboard: true
  verbose: 1
  log_interval: 10