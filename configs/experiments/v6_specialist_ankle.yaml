# V6 Specialist Training - Ankle Joint Failure Expert
# This specialist handles ankle joint failures (joints 4-7)
# Trained with 50% failure episodes, up to 2 ankle joints failing

defaults:
  - /train/default
  - /env/realant

experiment:
  name: v6_specialist_ankle
  description: "V6 Ensemble - Ankle joint failure specialist"

# Environment configuration
env:
  use_success_reward: true
  use_specialist_wrapper: true
  specialist_type: ankle_specialist
  training_phase: specialist  # Failure-focused training

# Start from baseline (optional - comment out to train from scratch)
pretrained_model: experiments/v6_specialist_normal/final_model.zip
pretrained_vecnormalize: experiments/v6_specialist_normal/vec_normalize.pkl

# PPO hyperparameters - gentler for specialist training
ppo:
  learning_rate: 0.00005  # Lower LR for fine-tuning
  n_epochs: 10
  batch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy network
policy:
  hidden_sizes: [64, 128]
  activation: relu

# Training configuration
total_timesteps: 5_000_000  # 5M steps for specialist training
num_envs: 8
eval_freq: 10000
save_freq: 250000

# Logging
logging:
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100
  verbose: 1

seed: 44