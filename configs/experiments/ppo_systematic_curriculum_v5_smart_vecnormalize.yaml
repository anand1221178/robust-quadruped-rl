defaults:
  - /train/default
  - /env/realant

# Systematic Curriculum V5 - SMART VECNORMALIZE SOLUTION
# Key innovation: VecNormalize reward normalization + phase transition reward stats reset

algorithm: PPO
experiment:
  name: ppo_systematic_curriculum_v5_smart_vecnormalize
  description: |
    BREAKTHROUGH V5 SYSTEMATIC CURRICULUM - SMART VECNORMALIZE APPROACH
    - Phase 0 (0-10M): Normal walking foundation with reward normalization
    - Phase 1 (10M-34M): ALL 8 single joints × 3M steps each = 24M total
    - Phase 2 (34M-64M): 10 strategic dual combinations × 3M steps each = 30M total
    - Phase 3: SKIPPED to match V3/V4 64M step budget
    - Total: 64M steps (matches V3/V4 training duration)
    - Key innovation: VecNormalize + reward stats reset at phase transitions

# Environment Configuration
env:
  name: RealAntMujoco-v0
  use_success_reward: true

# Number of parallel environments
num_envs: 8

# 🔥 V5 BREAKTHROUGH: Smart VecNormalize Configuration
vec_normalize:
  enabled: true
  norm_obs: true
  norm_reward: true   # 🔥 BACK TO STABLE PPO LEARNING
  clip_obs: 10.0

# Train from scratch
pretrained_model: null
pretrained_vec_normalize: null

# PPO Hyperparameters
ppo:
  learning_rate: 3.0e-04
  n_steps: 2048
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy Network Configuration
policy:
  type: MlpPolicy
  activation: relu
  hidden_sizes:
    - 64
    - 128

# V5 COMPLETE SYSTEMATIC CURRICULUM
systematic_curriculum:
  enabled: true

  # Phase 0: Foundation learning (10M steps)
  normal_walking_duration: 10000000

  # Phase 1: ALL 8 single joints (24M steps total)
  single_joint_duration: 3000000  # 3M per joint × 8 = 24M
  # hip_1, ankle_1, hip_2, ankle_2, hip_3, ankle_3, hip_4, ankle_4

  # Phase 2: Strategic dual combinations (30M steps total - matches research design)
  dual_combo_duration: 3000000    # 3M per combination × 10 strategic = 30M

  # STRATEGIC 10 dual combinations (from SYSTEMATIC_JOINT_FAILURE_CURRICULUM.md):
  anatomical_combinations:
    - [hip_1, ankle_1]      # A1: Complete front-left limb loss
    - [hip_2, ankle_2]      # A2: Complete front-right limb loss
    - [hip_3, ankle_3]      # A3: Complete rear-left limb loss
    - [hip_4, ankle_4]      # A4: Complete rear-right limb loss

  diagonal_combinations:
    - [hip_1, hip_4]        # B1: Cross-body hip coordination
    - [hip_2, hip_3]        # B2: Opposite diagonal compensation

  functional_combinations:
    - [hip_1, hip_2]        # C1: No anterior hip control
    - [hip_3, hip_4]        # C2: No posterior hip control
    - [ankle_1, ankle_2]    # C3: No front foot control
    - [ankle_3, ankle_4]    # C4: No rear foot control

  # Phase 3: SKIPPED to match V3/V4 64M budget
  triple_combo_duration: 0
  critical_triple_combinations: []

  # V5 SMART REWARD MANAGEMENT
  reset_reward_stats_on_phase_transition: true

# SYSTEMATIC CURRICULUM TRAINING (matches original research design)
total_timesteps: 64000000   # 64M steps: 10M + 24M + 30M (skip Phase 3 for V3/V4 comparison)

# Checkpointing Configuration
checkpoints:
  save_freq: 2000000  # Save every 2M steps (more frequent for long training)
  save_best: true
  save_last: true
  save_phase_transitions: true

# Logging Configuration
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl-v5-complete-systematic
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand

# Evaluation Configuration
eval_freq: 1000000  # Evaluate every 1M steps
evaluation:
  episodes: 10
  deterministic: true
  render: false

# Random Seed
seed: 42

# Research Configuration
research:
  hypothesis: |
    V5 COMPLETE SYSTEMATIC CURRICULUM HYPOTHESIS:
    - Phase 0 (0-10M): Stable baseline performance (~0.22 m/s)
    - Phase 1 (10M-34M): Master ALL 8 single joint failures individually
    - Phase 2 (34M-92M): Master ALL 28 dual joint combinations systematically
    - Phase 3 (92M-134M): Master 14 critical triple joint combinations
    - Expected: World's first complete systematic joint failure curriculum

  expected_outcomes:
    - "Phase 0: ~0.22 m/s baseline performance"
    - "Phase 1: ~0.18 m/s average across all 8 single joints"
    - "Phase 2: ~0.14 m/s average across all 28 dual combinations"
    - "Phase 3: ~0.10 m/s average across 14 triple combinations"
    - "Ultimate robustness: Handle any 1-3 joint failure scenario"

  success_criteria:
    - "Phase 1: >70% retention for each individual joint"
    - "Phase 2: >60% retention for each dual combination"
    - "Phase 3: >40% retention for each triple combination"
    - "Final model: Superior robustness to all previous approaches"

# V5 Complete Systematic Curriculum Features
v5_complete_curriculum:
  total_joint_scenarios_trained: 50  # 8 single + 28 dual + 14 triple
  training_duration: "~90 hours on Quadro RTX 8000"
  expected_robustness: "Handle any 1-3 joint failure with graceful degradation"
  research_breakthrough: "First complete systematic joint failure mastery"