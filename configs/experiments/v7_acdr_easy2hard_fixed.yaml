defaults:
  - /train/default
  - /env/realant

# V7 ACDR Easy2Hard - FIXED VERSION
# For comparison with fixed hard2easy approach
experiment:
  name: v7_acdr_easy2hard_fixed
  description: "V7 ACDR - Fixed Easy2hard curriculum for fair comparison"

# Environment configuration
env:
  use_success_reward: true
  use_v7_acdr: true

# V7 ACDR FIXED Parameters - Easy2Hard
v7_acdr:
  curriculum_type: easy2hard
  # FIXED: Start with working robot (100-120% joint strength)
  initial_L: 1.0          # Normal operation
  initial_U: 1.2          # Slight enhancement
  # FIXED: End with realistic severe failures (0-20%)
  target_L: 0.0           # Complete failures at end
  target_U: 0.2           # Severe impairments
  # FIXED: Faster curriculum progression
  update_step: 0.02       # 2x faster than original
  # FIXED: Shorter adaptation window
  performance_window: 50  # Half of original
  performance_threshold: null
  verbose: true

# Training parameters - match fixed hard2easy
total_timesteps: 20000000  # 20M steps
save_freq: 500000

# PPO hyperparameters
ppo:
  learning_rate: 0.00022
  batch_size: 512
  clip_range: 0.2
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy network
policy:
  activation: tanh
  hidden_sizes: [64, 64]

# Environment settings
num_envs: 8
seed: 42

# Reward configuration
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0

# Logging
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
    - v7
    - acdr
    - easy2hard
    - fixed
    - curriculum-dr
    - comparison

# Evaluation
eval_freq: 10000