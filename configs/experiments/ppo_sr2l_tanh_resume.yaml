# Resume SR2L Tanh Training after 24h timeout
# Continue from checkpoint after cluster time limit

defaults:
  - /train/base
  - /env/realant

experiment:
  name: ppo_sr2l_tanh_resume
  description: "Resume SR2L Tanh training after 24h cluster timeout"
  tags:
    - ppo
    - sr2l
    - tanh_activation
    - resume
    - nan_fix_test

# Enable SR2L with TANH ACTIVATION
sr2l:
  enabled: true
  lambda_smooth: 0.001          # Same gentle regularization
  perturbation_std: 0.01        # Small perturbations
  max_perturbation: 0.05        # Cap maximum perturbation
  warmup_steps: 8000000         # Might be completed
  curriculum_steps: 15000000    # In progress
  perturb_only_joints: true     # Only perturb joint observations
  joint_start_dim: 13
  joint_end_dim: 28
  
  # Use curriculum
  use_curriculum: true

# Disable Domain Randomization
domain_randomization:
  enabled: false

# Environment settings
env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_domain_randomization: false

# REMAINING timesteps - 25.9M completed, 4.1M to go
total_timesteps: 4100000  # Remaining steps (30M - 25.9M)

# PPO hyperparameters (same as before)
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - TANH ACTIVATION (key fix)
policy:
  hidden_sizes: [64, 128]
  activation: tanh              # Critical for bounded actions

# LOAD from latest checkpoint (25.9M steps completed)
pretrained_model: experiments/ppo_sr2l_tanh_pw41illb/checkpoints/model_25900000_steps.zip
vec_normalize_path: experiments/ppo_sr2l_tanh_pw41illb/checkpoints/model_vecnormalize_25900000_steps.pkl

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_sr2l_tanh_resume"
  verbose: 1

# Save settings
eval_freq: 10000
n_eval_episodes: 5
save_freq: 100000

# Notes:
# - Resumes SR2L with tanh activation after 24h timeout
# - Key test: Does tanh prevent NaN issues long-term?
# - Adjust total_timesteps based on actual progress
# - Update pretrained_model path to latest checkpoint