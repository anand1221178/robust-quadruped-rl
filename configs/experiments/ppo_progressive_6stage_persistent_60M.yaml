# 🚀 NUCLEAR OPTION 4B: Multi-Stage Progressive Persistent DR (60M steps)
# Approach: Manually staged progression with DomainRandomizationWrapper
# Theory: Progressive stages without curriculum complexity

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_progressive_6stage_persistent_60M
  description: "NUCLEAR ROBUSTNESS: 6-stage progressive persistent DR (60M steps)"

# 🎯 STAGED PERSISTENT DR (60M TOTAL)
# Note: This will require manual stage switching during training
# Stage 1: 0-15M steps - 0.0% failures
# Stage 2: 15-25M steps - 0.5% failures  
# Stage 3: 25-35M steps - 1.0% failures
# Stage 4: 35-45M steps - 2.0% failures
# Stage 5: 45-55M steps - 4.0% failures
# Stage 6: 55-60M steps - 6.0% failures

domain_randomization:
  use_curriculum: false
  wrapper_type: DomainRandomizationWrapper
  
  # 🔥 FINAL STAGE SETTINGS (will be used for full run - not ideal but functional)
  joint_dropout_prob: 0.02      # 2% average across all stages
  max_dropped_joints: 1         # Single joint max
  min_dropped_joints: 0         # 🔥 OPTIONAL failures!
  sensor_noise_std: 0.005       # Mild noise
  noise_joints_only: true

# 🧠 PPO Configuration (proven working)
ppo:
  learning_rate: 0.0003          # Standard rate
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 60000000        # 60M steps - MAXIMUM training
checkpoint_freq: 1000000         # Save every 1M steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["persistent-dr", "progressive", "60M-steps", "maximum-overkill"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 4B: 6-stage progressive persistent DR (manual staging required)"