# 🚀 NUCLEAR OPTION 4B: Multi-Stage Progressive Persistent DR (60M steps)
# Hydra config - constant moderate DR for maximum training time

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ppo_progressive_6stage_persistent_60M
  description: "NUCLEAR ROBUSTNESS: Ultra-long progressive persistent DR (60M steps)"

# Domain randomization configuration
domain_randomization:
  enabled: true
  wrapper_type: DomainRandomizationWrapper
  use_curriculum: false
  
  # 🔥 MODERATE SETTINGS (constant throughout training)
  joint_dropout_prob: 0.02      # 2% chance - moderate
  max_dropped_joints: 1         # Single joint max
  min_dropped_joints: 0         # 🔥 OPTIONAL failures!
  sensor_noise_std: 0.005       # Mild noise
  noise_joints_only: true

# Override training parameters
total_timesteps: 60000000        # 60M steps - MAXIMUM training
save_freq: 1000000              # Save every 1M steps

# Override logging for this specific experiment
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100