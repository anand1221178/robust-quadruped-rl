defaults:
  - /train/default
  - /env/realant

# V7.5B - BINARY DEATH TRAINING (Relaunch)
# Train with joints either fully working or completely dead - no middle ground
experiment:
  name: v7_5b_binary_death_relaunch
  description: "RELAUNCH V7.5B - Binary death training: 50% normal, 50% with completely dead joints"

env:
  use_success_reward: true
  use_domain_randomization: true

# AGGRESSIVE DR - 70% failure rate, always severe
domain_randomization:
  enabled: true
  joint_dropout_prob: 0.7
  min_dropped_joints: 1
  max_dropped_joints: 1
  sensor_noise_std: 0.0

total_timesteps: 30000000
save_freq: 1000000

ppo:
  learning_rate: 0.00012
  batch_size: 2048
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.0
  dead_joint_compensation_multiplier: 2.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5b-relaunch", "binary-death", "clean-batch"]
