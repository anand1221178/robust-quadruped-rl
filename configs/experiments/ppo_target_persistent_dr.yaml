# Persistent DR with TargetWalkingWrapper (WORKING APPROACH)
# Joint failures with goal-directed behavior

defaults:
  - /train/default
  - /env/realant

experiment:
  name: ppo_target_persistent_dr
  description: "Persistent DR with proven TargetWalkingWrapper - joint failure robustness + A-to-B locomotion"
  tags:
    - ppo
    - persistent_dr
    - target_walking
    - joint_failure_robustness
    - working_approach

# Environment settings - USE PROVEN TARGETWALKINGWRAPPER
env:
  name: RealAntMujoco-v0
  use_success_reward: false           # NO speed-only rewards
  use_target_walking: true            # PROVEN goal-directed wrapper
  use_smooth_target_walking: false    # NO broken smooth wrapper
  target_distance: 5.0                # 5m targets
  use_domain_randomization: false
  
  # ENABLE PERSISTENT DR
  use_persistent_dr: true
  persistent_dr:
    failure_prob: 0.15                # 15% of episodes have failures
    max_failed_joints: 2              # Up to 2 joints fail simultaneously
    
    # Realistic failure durations (key innovation)
    duration_probs: [0.4, 0.4, 0.2]  # [short, medium, long]
    short_duration: [50, 200]         # 2.5-10 seconds
    medium_duration: [200, 1000]      # 10-50 seconds
    
    # Failure types
    failure_types: ['lock', 'weak', 'erratic']
    failure_type_probs: [0.5, 0.3, 0.2]
    
    # Progressive curriculum - maintain goals first!
    use_curriculum: true
    warmup_steps: 5000000             # 5M steps maintaining goal-directed behavior
    curriculum_steps: 15000000        # 15M steps gradual failure introduction

# Disable other methods
sr2l:
  enabled: false

domain_randomization:
  enabled: false

permanent_dr:
  enabled: false

# PPO settings - LOWER LR for fine-tuning
ppo:
  learning_rate: 0.0001               # Lower LR since fine-tuning
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture
policy:
  hidden_sizes: [64, 128]
  activation: relu

# Training settings - FINE-TUNING from working baseline
total_timesteps: 25000000       # 25M steps for DR complexity
num_envs: 8
seed: 42

# LOAD FROM WORKING BASELINE (proven 0.220 m/s with targets)
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
vec_normalize_path: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_target_persistent_dr"
  verbose: 1

# Save settings
save_freq: 100000
eval_freq: 10000
n_eval_episodes: 5

# EXPECTED OUTCOME:
# - Maintains goal-directed behavior during failures
# - Adapts to joint failures for 50-1000 timesteps
# - Continues reaching targets even with failures
# - Better than speed-only DR because it has PURPOSE