# SR2L + Smooth Goal-Directed Locomotion
# Finally doing SR2L RIGHT - with actual goals!

defaults:
  - /train/default
  - /env/realant

experiment:
  name: ppo_smooth_sr2l
  description: "SR2L with smooth goal-directed locomotion - sensor noise robustness with A-to-B behavior"
  tags:
    - ppo
    - sr2l
    - smooth_target_walking
    - sensor_noise_robustness
    - goal_directed

# Enable SR2L with TANH ACTIVATION (NaN fix)
sr2l:
  enabled: true
  lambda_smooth: 0.001          # Gentle regularization
  perturbation_std: 0.01        # Small sensor noise (1%)
  max_perturbation: 0.05        # Cap maximum perturbation
  warmup_steps: 8000000         # 8M step warmup (lots of time to learn goals first!)
  curriculum_steps: 20000000    # 20M curriculum phase
  perturb_only_joints: true     # Only perturb joint observations (dims 13-28)
  joint_start_dim: 13           # Start of joint obs in RealAnt
  joint_end_dim: 28             # End of joint obs  
  use_curriculum: true          # Gradual introduction

# Environment settings - SMOOTH + GOAL-DIRECTED
env:
  name: RealAntMujoco-v0
  use_success_reward: false           # NO speed-only rewards
  use_target_walking: false           # NO jerky version
  use_smooth_target_walking: true     # SMOOTH goal-directed version!
  target_distance: 5.0                # 5m targets
  use_domain_randomization: false

# Disable other DR methods
domain_randomization:
  enabled: false

permanent_dr:
  enabled: false

# PPO settings (proven)
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64                # Smaller batches for SR2L stability
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - TANH ACTIVATION (critical for SR2L!)
policy:
  hidden_sizes: [64, 128]
  activation: tanh              # Bounded outputs prevent NaN crashes!

# Training settings - GO BIG!
total_timesteps: 40000000       # 40M steps - longer than baseline for complexity
num_envs: 8
seed: 42

# No pretrained model - train from scratch with new obs space
pretrained_model: null
vec_normalize_path: null

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_smooth_sr2l"
  verbose: 1

# Save settings
save_freq: 100000
eval_freq: 10000
n_eval_episodes: 5

# EXPECTED OUTCOME:
# - Robot walks smoothly from A to B under sensor noise
# - Maintains goal-directed behavior even with 5% joint sensor noise
# - No NaN crashes (tanh activation)
# - Better than previous SR2L attempts because it has ACTUAL goals