# 🎯 NUCLEAR OPTION 2B: Fine-tune from Baseline with Persistent DR (20M steps)
# Approach: Start with working 0.224 m/s baseline + gentle persistent DR
# Theory: Transfer learning with constant gentle DR

algorithm: PPO
env:
  name: RealAntMujoco-v0
  use_success_reward: true

experiment:
  name: ppo_finetune_persistent_20M
  description: "NUCLEAR ROBUSTNESS: Fine-tune from baseline with gentle persistent DR (20M steps)"

# 🔥 START FROM WORKING BASELINE
pretrained_model: "done/ppo_baseline_ueqbjf2x/best_model/best_model.zip"
pretrained_vec_normalize: "done/ppo_baseline_ueqbjf2x/vec_normalize.pkl"

# 🎯 GENTLE PERSISTENT DR (20M TOTAL)
domain_randomization:
  use_curriculum: false
  wrapper_type: DomainRandomizationWrapper
  
  # 🔥 GENTLE SETTINGS (constant throughout fine-tuning)
  joint_dropout_prob: 0.02      # 2% chance - gentle
  max_dropped_joints: 1         # Single joint max
  min_dropped_joints: 0         # 🔥 OPTIONAL failures!
  sensor_noise_std: 0.005       # Mild noise
  noise_joints_only: true

# 🧠 PPO Configuration (ULTRA-LOW LR for fine-tuning)
ppo:
  learning_rate: 0.00005         # 🔥 ULTRA-LOW for gentle fine-tuning
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1                # Smaller clips for stability

# 🏗️ Policy Architecture (match baseline exactly)
policy:
  activation: relu
  hidden_sizes: [64, 128]

# ⏱️ Training Configuration
total_timesteps: 20000000        # 20M steps fine-tuning
checkpoint_freq: 500000          # Save every 500K steps
log_interval: 100               # Log every 100 steps

# 💾 Experiment Tracking
logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: null

# 🏷️ Experiment metadata
experiment:
  tags: ["persistent-dr", "fine-tuning", "from-baseline", "20M-steps", "nuclear-option"]
  notes: "NUCLEAR ROBUSTNESS ATTEMPT 2B: Fine-tune working baseline with gentle persistent DR"