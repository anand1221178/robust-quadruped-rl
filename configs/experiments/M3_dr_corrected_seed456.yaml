# M3 CORRECTED - Domain Randomization with ACTUAL Curriculum
# FIXES:
#   1. Correct parameter names (joint_dropout_prob, max_dropped_joints)
#   2. Phase configs at top level (not nested under curriculum)
#   3. Proper 3-phase curriculum structure
#   4. CRITICAL: Added env.use_domain_randomization flag
defaults:
- /train/default
- /env/realant

experiment:
  name: M3_dr_corrected_seed456
  description: "CORRECTED M3 - DR with 3-phase curriculum (seed=456)"

total_timesteps: 32000000
seed: 456
save_freq: 1000000

# 🔥 CRITICAL FIX: Enable domain randomization
env:
  use_domain_randomization: true

logging:
  wandb: true
  wandb_project: robust-quadruped-rl-final
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags:
  - M3_dr_corrected
  - seed456
  - final_submission
  - curriculum_fixed

# 🔥 CORRECTED DOMAIN RANDOMIZATION WITH CURRICULUM
domain_randomization:
  enabled: true
  use_curriculum: true

  # Phase timing (cumulative steps)
  phase_1_steps: 10000000   # Phase 1: 0-10M steps (clean learning)
  phase_2_steps: 10000000   # Phase 2: 10-20M steps (single failures)
  phase_3_steps: 12000000   # Phase 3: 20-32M steps (multiple failures)

  # Phase 1: Clean training (learn perfect locomotion)
  phase_1_config:
    joint_dropout_prob: 0.0      # ✅ CORRECT parameter name
    max_dropped_joints: 0        # ✅ CORRECT parameter name
    min_dropped_joints: 0
    sensor_noise_std: 0.0        # No noise in phase 1

  # Phase 2: Single joint failures + mild noise
  phase_2_config:
    joint_dropout_prob: 0.10     # 10% failure rate (optimal)
    max_dropped_joints: 1        # Single joint only
    min_dropped_joints: 1        # Force at least 1 when triggered
    sensor_noise_std: 0.01       # Mild sensor noise

  # Phase 3: Multiple joint failures + moderate noise
  phase_3_config:
    joint_dropout_prob: 0.20     # 20% failure rate (harder)
    max_dropped_joints: 2        # Up to 2 joints
    min_dropped_joints: 1
    sensor_noise_std: 0.02       # Moderate sensor noise

# PPO hyperparameters (match original)
ppo:
  learning_rate: 0.0003
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy architecture
policy:
  activation: relu
  hidden_sizes:
  - 64
  - 128

# Environment
num_envs: 8
eval_freq: 10000
