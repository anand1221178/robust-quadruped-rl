defaults:
  - /train/default
  - /env/realant

# Experiment settings
experiment:
  description: "PPO + SR2L for forward locomotion robustness - Tanh activation"
  name: ppo_sr2l_forward
  tags: 
    - ppo
    - sr2l
    - forward-locomotion
    - tanh-activation
    - sensor-noise-robustness
    - joint-perturbations

# Enable SR2L (Smooth Regularized RL) with TANH ACTIVATION
sr2l:
  enabled: true
  lambda_smooth: 0.001          # Gentle regularization (proven to work)
  perturbation_std: 0.01        # Small perturbations (sensor noise level)
  max_perturbation: 0.05        # Cap maximum perturbation
  warmup_steps: 5000000         # 5M warmup to learn forward walking first
  curriculum_steps: 15000000    # 15M progressive increase
  perturb_only_joints: true     # Only perturb joint observations (dims 13-28)
  joint_start_dim: 13
  joint_end_dim: 28
  use_curriculum: true

# Disable Domain Randomization (this is pure SR2L test)
domain_randomization:
  enabled: false

# Environment settings - MATCH BASELINE EXACTLY
env:
  name: RealAntMujoco-v0
  use_success_reward: true       # Match baseline wrapper exactly (forward locomotion)
  use_domain_randomization: false

# Total training steps - sufficient for SR2L convergence
total_timesteps: 20000000        # 20M steps

# Train from scratch with tanh to avoid ReLU pretrained conflicts
pretrained_model: null           # Train from scratch (tanh vs ReLU incompatible)

# PPO hyperparameters - MATCH BASELINE EXACTLY
ppo:
  learning_rate: 0.0003
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0                  # No entropy bonus (matching baseline)
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - KEY CHANGE: TANH ACTIVATION
policy:
  hidden_sizes: [64, 128]       # Same as baseline
  activation: tanh              # *** TANH ACTIVATION TO BOUND OUTPUTS AND PREVENT NaN ***

# Environment setup
num_envs: 8
seed: 42

# Evaluation settings
eval_freq: 10000                # Frequent evaluation to catch issues early
save_freq: 100000               # Save every 100k steps

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_entity: "anandpatel1221178-university-of-the-witswatersrand"
  verbose: 1

# Notes:
# - Tanh activation bounds outputs to [-1, 1] matching RealAnt action space
# - Should prevent unbounded actions causing NaN in physics simulation
# - Training from scratch to avoid ReLU pretrained model conflicts
# - Joint-only perturbations to simulate sensor noise robustness
# - Expected performance: 0.18-0.20 m/s with excellent noise robustness