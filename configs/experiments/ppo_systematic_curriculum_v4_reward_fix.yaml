defaults:
  - /train/default
  - /env/realant

# Systematic Curriculum V4 - MINIMAL REWARD NORMALIZATION FIX
# Key innovation: Only change norm_reward=False to test if this fixes everything

algorithm: PPO
experiment:
  name: ppo_systematic_curriculum_v4_reward_fix
  description: |
    MINIMAL CHANGE V4 SYSTEMATIC CURRICULUM - REWARD NORMALIZATION FIX ONLY
    - Phase 0 (0-10M): Normal walking foundation (learn locomotion)
    - Phase 1 (10M-34M): Single joint failure training (8 joints × 3M each)
    - Phase 2 (34M-64M): Dual joint failure combinations (10 combos × 3M each)
    - Key fix: norm_reward=False ONLY - test if this solves the collapse
    - Hypothesis: Pure systematic curriculum will work with proper rewards

# Environment Configuration
env:
  name: RealAntMujoco-v0
  use_success_reward: true

# Number of parallel environments
num_envs: 8

# CRITICAL V4 FIX: Disable reward normalization
vec_normalize:
  enabled: true
  norm_obs: true
  norm_reward: false  # 🔥 THE CRITICAL FIX - preserve raw reward incentives
  clip_obs: 10.0

# Train from scratch (no pretrained model complications)
pretrained_model: null
pretrained_vec_normalize: null

# PPO Hyperparameters (standard from-scratch training)
ppo:
  learning_rate: 3.0e-04  # Standard learning rate
  n_steps: 2048
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01  # Standard entropy - no interleaving to provide diversity
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy Network Configuration
policy:
  type: MlpPolicy
  activation: relu
  hidden_sizes:
    - 64
    - 128

# Systematic Curriculum Configuration (UNCHANGED - pure systematic)
systematic_curriculum:
  enabled: true

  # Phase 0: Foundation learning (identical to V2.5)
  normal_walking_duration: 10000000  # 10M steps normal walking

  # Phase 1: Single joint mastery (10M-34M steps)
  single_joint_duration: 3000000  # 3M steps per joint × 8 joints = 24M total

  # Phase 2: Dual combinations (34M-64M steps)
  dual_combo_duration: 3000000    # 3M steps per combination × 10 combos = 30M total

  # V4: NO INTERLEAVING - pure systematic approach
  # Test if reward fix alone enables systematic curriculum to work

  # Anatomical combinations (complete limb failures)
  anatomical_combinations:
    - [hip_1, ankle_1]      # Front left leg
    - [hip_2, ankle_2]      # Front right leg
    - [hip_3, ankle_3]      # Rear left leg
    - [hip_4, ankle_4]      # Rear right leg

  # Diagonal combinations (cross-body coordination)
  diagonal_combinations:
    - [hip_1, hip_4]        # Front left + rear right
    - [hip_2, hip_3]        # Front right + rear left

  # Functional combinations (same joint types)
  functional_combinations:
    - [hip_1, hip_2]        # Both front hips
    - [hip_3, hip_4]        # Both rear hips
    - [ankle_1, ankle_2]    # Both front ankles
    - [ankle_3, ankle_4]    # Both rear ankles

  # Phase 3: Not implemented yet
  triple_combo_duration: 0
  critical_triple_combinations: []

# Total Training Steps
total_timesteps: 64000000  # 64M steps total: 10M baseline + 54M curriculum

# Checkpointing Configuration
checkpoints:
  save_freq: 1000000  # Save every 1M steps
  save_best: true
  save_last: true
  save_phase_transitions: true

# Logging Configuration
logging:
  verbose: 1
  log_interval: 100
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl-v4-reward-fix
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand

  # Track reward normalization impact
  custom_metrics:
    - curriculum/current_phase
    - curriculum/failed_joints
    - curriculum/pattern_type
    - robot/x_position
    - robot/height
    - robot/velocity_ms
    - robot/total_distance
    - rewards/raw_custom_reward     # Track SuccessRewardWrapper raw rewards
    - rewards/episode_return        # Track episode returns (should be much higher now)
    - performance/locomotion_speed
    - performance/baseline_retention

# Evaluation Configuration
eval_freq: 500000
evaluation:
  episodes: 10
  deterministic: true
  render: false

# Random Seed for Reproducibility
seed: 42

# Research Configuration
research:
  hypothesis: |
    V4 HYPOTHESIS: Pure systematic curriculum (100% failure episodes during phases)
    will work perfectly with norm_reward=False. Robot will:
    - Phase 0: Achieve ~0.22 m/s baseline performance
    - Phase 1: Maintain ~0.18-0.20 m/s with single joint failures
    - Phase 2: Maintain ~0.15-0.18 m/s with dual joint failures

    If successful, proves systematic curriculum design was correct and
    reward normalization was the only problem.

  expected_outcomes:
    - "Phase 0: Achieve ~0.22 m/s (baseline performance)"
    - "Phase 1: Maintain 0.18-0.20 m/s (80-90% retention)"
    - "Phase 2: Maintain 0.15-0.18 m/s (65-80% retention)"
    - "No learned helplessness due to preserved raw reward incentives"

  success_criteria:
    - "Phase 0: >0.20 m/s (90% baseline retention)"
    - "Phase 1: >0.16 m/s (70% retention minimum)"
    - "Phase 2: >0.12 m/s (50% retention minimum)"
    - "No stationary behavior (velocity always >0.05 m/s)"

# V4 Specific Features
v4_improvements:
  - "Single fix: norm_reward=False preserves SuccessRewardWrapper incentives"
  - "Pure systematic curriculum approach maintained"
  - "Raw reward tracking to verify fix effectiveness"
  - "Clean test of reward normalization hypothesis"
  - "Direct comparison with V2.5 failure to prove causation"