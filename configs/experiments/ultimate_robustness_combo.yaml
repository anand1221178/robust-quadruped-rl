# ULTIMATE ROBUSTNESS COMBO - PPO + SR2L + DOMAIN RANDOMIZATION
# Combining sensor noise robustness (SR2L) with joint failure robustness (DR)
# Building on proven success from done/ppo_sr2l_forward_m7gtjtpa + done/dr/v7_7e_ultra_speed

defaults:
  - /train/default
  - /env/realant

# Experiment metadata
experiment:
  name: ultimate_robustness_combo
  description: "ULTIMATE ABLATION: PPO + SR2L + Domain Randomization - Combined sensor noise + joint failure robustness"
  tags: ["ultimate_combo", "sr2l", "domain_randomization", "ablation_study", "sensor_noise", "joint_failures"]

# Environment setup - V7.7E proven configuration
env:
  name: RealAntMujoco-v0
  use_success_reward: true
  use_domain_randomization: true

  # V7.7E ultra speed configuration (proven to work)
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  use_ultra_speed_mode: true
  speed_bonus_multiplier: 3.0
  speed_bonus_threshold: 0.1
  target_velocity: 0.15
  velocity_retention_bonus: true

# DOMAIN RANDOMIZATION - V7.7E proven curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  # 3-phase curriculum from V7.7E champion
  phase_1_steps: 10000000   # 10M steps clean learning
  phase_2_steps: 10000000   # 10M steps single joint failures
  phase_3_steps: 10000000   # 10M steps dual joint failures

  # Phase 1: Clean learning (no failures)
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0

  # Phase 2: Single joint failures (V7.7E proven)
  phase_2_config:
    joint_dropout_prob: 0.5    # 50% episodes have failures
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0       # No sensor noise during joint failure learning

  # Phase 3: Dual joint failures (V7.7E proven)
  phase_3_config:
    joint_dropout_prob: 0.6    # 60% episodes have failures
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0       # No sensor noise during complex failure learning

# SR2L CONFIGURATION - From proven ppo_sr2l_forward_m7gtjtpa
sr2l:
  enabled: true

  # Proven SR2L parameters
  lambda_smooth: 0.001          # Gentle regularization
  perturbation_std: 0.01        # Small sensor noise (10x training tolerance achieved)
  max_perturbation: 0.05        # Maximum noise level

  # Joint-only perturbations (proven effective)
  perturb_only_joints: true
  joint_start_dim: 13           # Start of joint observations
  joint_end_dim: 28             # End of joint observations

  # Curriculum approach
  use_curriculum: true
  warmup_steps: 5000000         # 5M steps before SR2L kicks in
  curriculum_steps: 15000000    # Gradual increase over 15M steps

# Extended training for dual robustness
total_timesteps: 30000000  # 30M steps (10M + 10M + 10M phases)
save_freq: 1000000

# PPO settings - Hybrid of both proven configs
ppo:
  learning_rate: 0.0001      # V7.7E proven LR
  batch_size: 1536           # V7.7E batch size
  n_epochs: 8                # V7.7E epochs
  gamma: 0.995               # V7.7E gamma
  gae_lambda: 0.97           # V7.7E gae_lambda
  clip_range: 0.15           # V7.7E clip range
  ent_coef: 0.005            # V7.7E entropy coefficient
  vf_coef: 0.5               # Standard value function coefficient
  max_grad_norm: 0.4         # V7.7E gradient clipping

# Policy configuration - Proven tanh activation
policy:
  activation: tanh           # Proven to prevent NaN crashes
  hidden_sizes: [128, 128]   # V7.7E architecture

# V7.7E reward configuration (essential for speed)
reward_config:
  mastery_bonus: 100.0       # V7.7E
  speed_weight: 1.5          # V7.7E
  survival_bonus: 0.5        # V7.7E
  use_modified_reward: true  # V7.7E

# Logging
log_freq: 10000
eval_freq: 1000000
eval_episodes: 10

# W&B
wandb:
  enabled: true
  entity: anandpatel_patel_robust_rl_research
  project: robust-quadruped-rl
  tags: ["ultimate_combo", "sr2l_dr", "ablation_final", "sensor_noise", "joint_failures"]
  name: ultimate_robustness_combo