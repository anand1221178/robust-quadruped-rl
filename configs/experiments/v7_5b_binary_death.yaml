defaults:
  - /train/default
  - /env/realant

# V7.5B - BINARY DEATH TRAINING
# Train with joints either fully working or completely dead - no middle ground
experiment:
  name: v7_5b_binary_death
  description: "V7.5B - Binary death training: 50% normal, 50% with completely dead joints"

env:
  use_success_reward: true
  use_domain_randomization: true
  
# Binary Death Configuration - NO CURRICULUM!
domain_randomization:
  enabled: true
  wrapper_type: "DomainRandomizationWrapper"
  # Binary mode - either perfect or dead
  joint_failure_mode: "binary_death"
  joint_failure_prob: 0.5  # 50% of episodes have failures
  min_dropped_joints: 1
  max_dropped_joints: 1  # Always exactly 1 joint when failure occurs
  failure_strength: 0.0  # k=0, completely dead
  sensor_noise_std: 0.0  # No sensor noise, focus on joint failures

total_timesteps: 30000000  # 30M steps of brutal training
save_freq: 1000000

ppo:
  learning_rate: 0.00012  # Slightly higher for aggressive learning
  batch_size: 2048
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.01  # Higher exploration for finding compensation strategies
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  activation: tanh
  hidden_sizes: [128, 128]

# Reward that explicitly values dead joint compensation
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.0  # Normal speed reward
  # Special bonuses for walking with dead joints
  dead_joint_compensation_multiplier: 2.0  # DOUBLE rewards when joint is dead

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5b", "binary-death", "no-curriculum", "compensation"]