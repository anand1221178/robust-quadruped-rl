# V6 Specialist Training - Multi-Joint Failure Expert
# This specialist handles complex multi-joint failures (up to 3 joints)
# Trained with 70% failure episodes for comprehensive robustness

defaults:
  - /train/default
  - /env/realant

experiment:
  name: v6_specialist_multi
  description: "V6 Ensemble - Multi-joint failure specialist"

# Environment configuration
env:
  use_success_reward: true
  use_specialist_wrapper: true
  specialist_type: multi_joint_specialist
  training_phase: specialist  # Failure-focused training

# Start from baseline (optional - comment out to train from scratch)
pretrained_model: experiments/v6_specialist_normal/final_model.zip
pretrained_vecnormalize: experiments/v6_specialist_normal/vec_normalize.pkl

# PPO hyperparameters - very gentle for complex failures
ppo:
  learning_rate: 0.00001  # Ultra-low LR for complex adaptation
  n_epochs: 10
  batch_size: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# Policy network
policy:
  hidden_sizes: [64, 128]
  activation: relu

# Training configuration
total_timesteps: 7_500_000  # 7.5M steps for complex failure training
num_envs: 8
eval_freq: 10000
save_freq: 250000

# Logging
logging:
  tensorboard: true
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  log_interval: 100
  verbose: 1

seed: 45