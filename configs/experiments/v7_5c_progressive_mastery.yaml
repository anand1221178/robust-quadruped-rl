defaults:
  - /train/default
  - /env/realant

# V7.5C - PROGRESSIVE JOINT MASTERY
# Master one joint failure at a time before moving to the next
experiment:
  name: v7_5c_progressive_mastery
  description: "V7.5C - Progressive mastery: Train 4M steps per specific joint failure"

env:
  use_success_reward: true
  use_domain_randomization: true

# PROGRESSIVE DR - Starts low, increases over time
domain_randomization:
  enabled: true
  # Use CurriculumDRWrapper (it exists!)
  wrapper_type: "CurriculumDRWrapper"
  # Phase-based progression
  phase_1_steps: 10000000  # 10M clean training
  phase_2_steps: 10000000  # 10M single failures
  phase_3_steps: 12000000  # 12M dual failures
  # Phase 1: No failures
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0  # ADDED THIS
  # Phase 2: Single joint failures
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0  # ADDED THIS
  # Phase 3: Dual joint failures
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0  # ADDED THIS

total_timesteps: 32000000  # 32M steps (4M per joint)
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.1
  # Bonus for mastering current joint
  mastery_bonus: 50.0  # Extra reward when walking well with failed joint

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5c", "progressive-mastery", "joint-specialization"]