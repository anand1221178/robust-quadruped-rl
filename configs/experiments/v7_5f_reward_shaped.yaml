defaults:
  - /train/default
  - /env/realant

# V7.5F - REWARD SHAPING
# Explicitly reward walking with dead joints
experiment:
  name: v7_5f_reward_shaped
  description: "V7.5F - Reward shaping: Huge bonuses for compensated locomotion"

env:
  use_success_reward: true
  use_v7_acdr: true

# EXTREME ACDR - Goes to complete failure fast
v7_acdr:
  curriculum_type: hard2easy
  initial_L: 0.4    # Start VERY hard
  initial_U: 0.6
  target_L: 0.0     # Complete dead joints
  target_U: 0.0     # ALL joints can go to zero
  update_step: 0.012  # FAST progression
  performance_window: 150
  performance_threshold: 0.08  # Very low threshold
  verbose: true

total_timesteps: 30000000  # 30M steps
save_freq: 1000000

ppo:
  learning_rate: 0.00013
  batch_size: 2048
  n_epochs: 10
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.01  # Higher exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

policy:
  activation: tanh
  hidden_sizes: [128, 128]

# AGGRESSIVE REWARD SHAPING
reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.0  # Base speed reward
  
  # Massive bonuses for walking with failures
  failure_compensation_rewards:
    enabled: true
    velocity_threshold: 0.05  # If moving > 0.05 m/s with failure
    compensation_multipliers:
      k_1.0: 1.0   # Normal walking: 1x reward
      k_0.5: 2.0   # Half strength: 2x reward
      k_0.2: 3.0   # 20% strength: 3x reward
      k_0.0: 5.0   # DEAD JOINT: 5x reward!
  
  # Special showcase bonus
  showcase_mode: true
  dead_joint_walking_bonus: 500.0  # HUGE bonus for your exact demo scenario
  min_showcase_velocity: 0.08      # Must walk at least 0.08 m/s for bonus

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5f", "reward-shaped", "compensation-bonus", "showcase-optimized"]