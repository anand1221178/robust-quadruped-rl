defaults:
  - /train/default
  - /env/realant

# Experiment settings
experiment:
  description: "PPO + Permanent DR for forward locomotion - Extreme disability adaptation"
  name: ppo_permanent_dr_forward
  tags: 
    - ppo
    - permanent-dr
    - forward-locomotion
    - extreme-failures
    - disability-adaptation
    - most-challenging

# Disable SR2L (this is DR only)
sr2l:
  enabled: false

# Enable Domain Randomization with EXTREME settings to simulate permanent failures
domain_randomization:
  enabled: true
  # EXTREME settings - simulate permanent failures as closely as possible (FIXED PARAMETER NAMES)
  joint_dropout_prob: 0.30           # 30% chance of joint failures (very high)
  max_dropped_joints: 4              # Up to 4 joints can fail (most extreme)
  min_dropped_joints: 1              # At least 1 joint fails when dropout occurs
  sensor_noise_std: 0.01             # Keep noise low (focus on joint failures)
  noise_joints_only: true            # Only add noise to joint sensors

# Environment settings - MATCH BASELINE EXACTLY  
env:
  name: RealAntMujoco-v0
  use_success_reward: true           # Match baseline wrapper exactly (forward locomotion)
  use_domain_randomization: true     # Enable DR wrapper

# EXTENDED training steps - most challenging task needs most time
total_timesteps: 30000000            # 30M steps for permanent DR adaptation

# Initialize from baseline for faster convergence
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip

# PPO hyperparameters - MATCH BASELINE EXACTLY
ppo:
  learning_rate: 0.00005             # Very low LR for fine-tuning extreme adaptation
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02                     # Higher entropy for exploration under extreme failures
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - ReLU works fine with DR
policy:
  hidden_sizes: [64, 128]           # Same as baseline
  activation: relu                  # ReLU (DR doesn't cause NaN like SR2L)

# Environment setup
num_envs: 8
seed: 42

# Evaluation settings
eval_freq: 10000                    # Frequent evaluation (important for extreme training)
save_freq: 50000                    # Save more frequently (longer training)

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_entity: "anandpatel1221178-university-of-the-witswatersrand"
  verbose: 1

# Notes:
# - APPROXIMATES permanent DR using extreme settings with current wrapper
# - 30% dropout rate with up to 4 failed joints simulates severe disabilities
# - Aggressive curriculum forces rapid adaptation to failures
# - Extended training (30M steps) for this most challenging task
# - Very low learning rate for careful fine-tuning under extreme conditions
# - Expected performance: 0.10-0.15 m/s (maintaining some locomotion with 4 failed joints)
#
# TRUE PERMANENT DR WOULD REQUIRE:
# - Custom PermanentDRWrapper where failed joints NEVER recover
# - Accumulating failures: 0.001 chance per step of new permanent failure
# - Progressive disability: 0→4 joints fail permanently over training
# - Current approach is reasonable approximation using existing infrastructure