defaults:
  - /train/default
  - /env/realant

# V7.7D PROGRESSIVE MASTERY - Backward penalty increases over training
# Start gentle (2x) for exploration, end harsh (6x) for refinement
experiment:
  name: v7_7d_progressive_mastery
  description: "Progressive penalty: 2x→6x over training for exploration→refinement"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Progressive backward penalty system
  use_backward_penalty: true
  use_progressive_penalty: true
  initial_backward_penalty: 2.0   # Start gentle for exploration
  final_backward_penalty: 6.0     # End harsher than V7.6C
  penalty_ramp_steps: 20000000    # Ramp over 20M steps
  # Also add stationary penalty
  stationary_penalty: -0.3
  stationary_threshold: 0.05

# Same proven progressive curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.008  # Higher entropy for early exploration
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.1
  mastery_bonus: 50.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.7d", "progressive-mastery", "2x-to-6x", "exploration-refinement"]