defaults:
  - /train/default
  - /env/realant

# V7.8D DYNAMIC SPEED TARGETS - Ultra Speed + adaptive thresholds
# Adjusts speed bonus thresholds based on which joints are failed
experiment:
  name: v7_8d_dynamic_speed
  description: "Ultra Speed + dynamic speed targets based on failure type"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # ULTRA SPEED BASE (from V7.7e)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10  # Default threshold
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15  # Default target
  # NEW: Dynamic speed targets based on failure
  use_dynamic_speed_targets: true
  dynamic_targets:
    no_failure:
      thresholds: [0.10, 0.12, 0.15]
      multipliers: [1.5, 2.0, 3.0]
    hip_failure:
      thresholds: [0.08, 0.10, 0.12]  # Lower targets for hip failures
      multipliers: [1.5, 2.0, 3.0]
    ankle_failure:
      thresholds: [0.05, 0.08, 0.10]  # Much lower for ankle failures
      multipliers: [2.0, 2.5, 3.5]  # Higher multipliers to compensate
    multi_failure:
      thresholds: [0.03, 0.05, 0.08]  # Very low for multiple failures
      multipliers: [2.5, 3.0, 4.0]  # Even higher multipliers
  # Adaptive learning rate for different failure modes
  adaptive_difficulty: true
  difficulty_scaling: 0.8  # Scale down difficulty when joints fail

# Same progressive curriculum as Ultra Speed
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0
  adaptive_mastery: true  # Mastery threshold adapts to failure type

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.8d", "dynamic-speed", "adaptive-targets", "ultra-speed-base"]