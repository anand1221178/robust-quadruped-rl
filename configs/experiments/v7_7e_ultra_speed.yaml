defaults:
  - /train/default
  - /env/realant

# V7.7E ULTRA SPEED - Maximum focus on achieving high velocity
# Massive rewards for speed, penalties scale with velocity loss
experiment:
  name: v7_7e_ultra_speed
  description: "Ultra speed focus: 3x rewards for fast walking, velocity-scaled penalties"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # ULTRA SPEED FOCUS
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10      # Lower threshold
  speed_bonus_multiplier: 3.0      # 3x reward for speed!
  velocity_retention_bonus: true   # Bonus for maintaining % of baseline speed
  target_velocity: 0.15             # Target speed to achieve

# Same proven progressive curriculum
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.5     # Lower survival, higher speed focus
  speed_weight: 1.5       # Maximum speed weight
  mastery_bonus: 100.0    # Huge bonus for speed mastery

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.7e", "ultra-speed", "3x-bonus", "velocity-focus"]