defaults:
  - /train/default
  - /env/realant

# V7.7 SPEED CHAMPION - Speed Bonuses for Fast Walking with Failures
# Takes V7.6C foundation and adds speed bonuses for maintaining high velocity
experiment:
  name: v7_7_speed_champion
  description: "V7.6C + Speed bonuses for walking >0.12 m/s with failed joints"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep the successful 5x backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # NEW: Speed bonus system
  use_speed_bonus: true
  speed_bonus_threshold: 0.12  # Bonus when velocity > 0.12 m/s with failures
  speed_bonus_multiplier: 2.0   # 2x reward when achieving speed with failures

# Same proven progressive curriculum from V7.6C
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.2  # Slightly higher to encourage speed
  mastery_bonus: 50.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.7", "speed-champion", "speed-bonus", "5x-backward"]