defaults:
  - /train/default
  - /env/realant

# V7.10C SYMMETRIC TRAINING - V7.7E with symmetric/bidirectional training
# Fix ankle_2 vs ankle_4 asymmetry by removing directional bias
experiment:
  name: v7_10c_symmetric_training
  description: "V7.7E formula with symmetric training - no directional bias"

env:
  use_success_reward: true
  use_domain_randomization: true

  # EXACT V7.7E rewards (proven stable for 32M steps)
  use_backward_penalty: true
  backward_penalty_multiplier: 8.0

  # EXACT V7.7E ultra speed mode
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15

  # NEW: SYMMETRIC TRAINING FEATURES
  symmetric_training:
    enabled: true

    # Random starting orientations
    random_initial_yaw: true
    yaw_range: [-180, 180]  # Full 360° randomization

    # Bidirectional movement rewards
    bidirectional_mode: true
    reward_both_directions: true  # +X and -X equally valid

    # Mirror symmetric joint failures
    mirror_joint_pairs: true
    paired_joints:
      # Front ankles (mirror pair)
      - [ankle_1, ankle_2]
      # Rear ankles (mirror pair) - KEY PAIR!
      - [ankle_3, ankle_4]
      # Front hips (mirror pair)
      - [hip_1, hip_2]
      # Rear hips (mirror pair)
      - [hip_3, hip_4]

    # When training with ankle_4 failure, also train ankle_2
    # This forces equal competency
    symmetric_failure_sampling: true

    # Randomize observation frame
    randomize_observation_frame: true
    frame_randomization_prob: 0.5  # 50% chance to flip frame

# EXACT V7.7E curriculum (32M steps, proven to work)
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"

  phase_1_steps: 10000000  # 10M - Clean walking
  phase_2_steps: 12000000  # 12M - Single failures
  phase_3_steps: 10000000  # 10M - Combinations

  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0

  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 0
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    # NEW: Ensure symmetric sampling
    use_symmetric_sampling: true

  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 0
    max_dropped_joints: 2
    sensor_noise_std: 0.0
    # NEW: Ensure paired joints fail together sometimes
    prefer_paired_failures: true

# EXACT V7.7E training duration (no need for 50M)
total_timesteps: 32000000
save_freq: 1000000

# EXACT V7.7E hyperparameters (proven stable)
ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

# EXACT V7.7E network
policy:
  activation: tanh
  hidden_sizes: [128, 128]

# EXACT V7.7E rewards (no changes!)
reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.10c", "symmetric-training", "bidirectional", "ankle-parity", "32M-steps"]