# Permanent DR with TargetWalkingWrapper (WORKING APPROACH)
# Permanent joint disabilities with goal-directed behavior

defaults:
  - /train/default
  - /env/realant

experiment:
  name: ppo_target_permanent_dr
  description: "Permanent DR with proven TargetWalkingWrapper - permanent disability adaptation + A-to-B locomotion"
  tags:
    - ppo
    - permanent_dr
    - target_walking
    - disability_adaptation
    - working_approach

# Enable permanent DR
permanent_dr:
  enabled: true
  failure_rate: 0.001             # 0.1% chance per step of NEW permanent failure
  max_failed_joints: 4            # Up to 4 joints can permanently fail
  warmup_steps: 5000000           # 5M steps maintaining goal-directed behavior
  curriculum_steps: 20000000      # 20M steps gradual permanent failures
  start_failures: 0               # Start with no failures
  end_failures: 4                 # End with up to 4 permanent failures
  verbose: false

# Environment settings - USE PROVEN TARGETWALKINGWRAPPER
env:
  name: RealAntMujoco-v0
  use_success_reward: false           # NO speed-only rewards
  use_target_walking: true            # PROVEN goal-directed wrapper
  use_smooth_target_walking: false    # NO broken smooth wrapper
  target_distance: 5.0                # 5m targets
  use_permanent_dr: true              # Enable permanent DR wrapper
  use_domain_randomization: false

# Disable other methods
sr2l:
  enabled: false

domain_randomization:
  enabled: false

# PPO settings - LOWER LR for fine-tuning
ppo:
  learning_rate: 0.0001               # Lower LR since fine-tuning
  n_steps: 2048
  batch_size: 2048                    # Larger batches for stability
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01                      # Small entropy for exploration
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture
policy:
  hidden_sizes: [64, 128]
  activation: relu

# Training settings - LONGEST for hardest task
total_timesteps: 30000000       # 30M steps - hardest task needs most time
num_envs: 8
seed: 42

# LOAD FROM WORKING BASELINE (proven 0.220 m/s with targets)
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
vec_normalize_path: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_name: "ppo_target_permanent_dr"
  verbose: 1

# Save settings
save_freq: 100000
eval_freq: 50000                # Less frequent eval for speed

# EXPECTED OUTCOME:
# - Robot learns to reach targets with 4 permanently failed joints
# - Develops new gaits when joints fail forever
# - Maintains goal-directed behavior even with severe disabilities
# - True adaptive locomotion for A-to-B navigation