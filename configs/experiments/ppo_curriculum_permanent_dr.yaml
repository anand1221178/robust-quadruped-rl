defaults:
  - /train/default
  - /env/realant

# Experiment settings  
experiment:
  description: "PPO + CURRICULUM Permanent DR - Extreme robustness with proper curriculum"
  name: ppo_curriculum_permanent_dr
  tags: 
    - ppo
    - curriculum-dr
    - permanent-failures
    - extreme-robustness
    - research-proposal

# Disable SR2L (this is DR only)
sr2l:
  enabled: false

# Enable Domain Randomization with CURRICULUM for PERMANENT failures
domain_randomization:
  enabled: true
  
  # CURRICULUM IMPLEMENTATION for EXTREME robustness:
  # Phase 1 (0-10M steps): No faults → learn base locomotion
  # Phase 2 (10-20M steps): Single permanent joint + mild noise  
  # Phase 3 (20-30M steps): Multiple permanent joints + high noise
  
  # Phase 1: Clean training (0-10M steps)
  phase_1_steps: 10000000
  phase_1_config:
    joint_dropout_prob: 0.0        # No failures - learn base locomotion
    max_dropped_joints: 0
    min_dropped_joints: 0  
    sensor_noise_std: 0.0          # No noise
  
  # Phase 2: Single permanent joint + mild noise (10-20M steps)
  phase_2_steps: 10000000  
  phase_2_config:
    joint_dropout_prob: 0.10       # 10% chance single permanent joint failure
    max_dropped_joints: 1          # Single joint only
    min_dropped_joints: 1
    sensor_noise_std: 0.01         # Mild noise
  
  # Phase 3: Multiple permanent joints + high noise (20-30M steps) 
  phase_3_config:
    joint_dropout_prob: 0.25       # 25% chance multiple permanent joint failure
    max_dropped_joints: 3          # Up to 3 joints (more conservative than 4)
    min_dropped_joints: 1
    sensor_noise_std: 0.03         # High noise
    
  noise_joints_only: true          # Only add noise to joint sensors

# Environment settings - MATCH BASELINE EXACTLY
env:
  name: RealAntMujoco-v0
  use_success_reward: true         # Match baseline wrapper exactly
  use_domain_randomization: true   # Enable curriculum DR wrapper

# EXTENDED training steps for most difficult task
total_timesteps: 30000000          # 30M steps (10M + 10M + 10M phases)

# Initialize from PROVEN BASELINE for faster convergence  
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip

# PPO hyperparameters - MATCH BASELINE EXACTLY
ppo:
  learning_rate: 0.00005           # Very low LR for extreme adaptation fine-tuning
  batch_size: 2048
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.02                   # Higher entropy for exploration under extreme failures
  vf_coef: 0.5
  max_grad_norm: 0.5

# Network architecture - ReLU works fine with DR
policy:
  hidden_sizes: [64, 128]         # Same as baseline
  activation: relu                # DR doesn't cause NaN like SR2L

# Environment setup
num_envs: 8
seed: 42

# Evaluation settings
eval_freq: 10000                  # Frequent evaluation (important for extreme training)
save_freq: 50000                  # Save more frequently (longer training)

# Logging
logging:
  wandb: true
  wandb_project: "robust-quadruped-rl"
  wandb_entity: "anandpatel1221178-university-of-the-witswatersrand"
  verbose: 1

# Notes:
# - EXTREME robustness test with proper curriculum progression
# - Starts from proven baseline (0.224 m/s) - crucial for success
# - 30M steps with longer phases (10M each) for extreme adaptation learning
# - More conservative max joints (3 instead of 4) for better learning
# - Very low learning rate for careful adaptation to permanent disabilities  
# - Expected performance: 0.08-0.12 m/s (maintaining some locomotion with 3 failed joints)
# - This represents the "prosthetic/amputation" scenario from research proposal