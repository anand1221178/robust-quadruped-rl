defaults:
  - /train/default
  - /env/realant

# V7.5D - PERFORMANCE-BASED CURRICULUM
# Difficulty adjusts based on robot's actual performance
experiment:
  name: v7_5d_performance_based
  description: "V7.5D - Self-adjusting curriculum based on performance metrics"

env:
  use_success_reward: true
  use_v7_acdr: true

# Just use standard V7 ACDR with aggressive settings
v7_acdr:
  curriculum_type: hard2easy  # Standard type
  # VERY aggressive progression
  initial_L: 0.5    # Start harder than usual
  initial_U: 0.7
  target_L: 0.0     # Go to complete failure
  target_U: 0.1     # Almost dead joints
  update_step: 0.01 # Fast progression
  performance_window: 100
  performance_threshold: 0.10  # Low threshold, push through
  verbose: true

total_timesteps: 35000000  # 35M steps of adaptive training
save_freq: 1000000

ppo:
  learning_rate: 0.00009  # Stable for adaptive curriculum
  batch_size: 1792
  n_epochs: 7
  gamma: 0.994
  gae_lambda: 0.965
  clip_range: 0.17
  ent_coef: 0.007
  vf_coef: 0.5
  max_grad_norm: 0.35

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 1.0
  speed_weight: 1.2
  # Adaptive reward based on current difficulty
  difficulty_scaled_bonus: true  # More reward for walking at lower k values

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.5d", "performance-based", "adaptive-curriculum", "self-adjusting"]