defaults:
  - /train/default
  - /env/realant

# V7.8A ANKLE SPECIALIST - Ultra Speed base + focused ankle training
# Weighted sampling gives problematic ankles more training time
experiment:
  name: v7_8a_ankle_specialist
  description: "Ultra Speed + weighted ankle training (ankle_4: 3x, ankle_3: 2x, ankle_1: 2x)"

env:
  use_success_reward: true
  use_domain_randomization: true
  # Keep backward penalty
  use_backward_penalty: true
  backward_penalty_multiplier: 5.0
  # ULTRA SPEED BASE (from V7.7e)
  use_ultra_speed_mode: true
  speed_bonus_threshold: 0.10
  speed_bonus_multiplier: 3.0
  velocity_retention_bonus: true
  target_velocity: 0.15
  # NEW: Weighted joint sampling for ankles
  use_weighted_joint_sampling: true
  joint_sampling_weights:
    ankle_1: 2.0  # 2x more training
    ankle_3: 2.0  # 2x more training
    ankle_4: 3.0  # 3x more training (worst performer)
    # All others default to 1.0
  phase_2_ankle_focus: true  # 70% ankle failures in phase 2

# Progressive curriculum with ankle focus
domain_randomization:
  enabled: true
  wrapper_type: "CurriculumDRWrapper"
  phase_1_steps: 10000000
  phase_2_steps: 10000000
  phase_3_steps: 12000000
  phase_1_config:
    joint_dropout_prob: 0.0
    min_dropped_joints: 0
    max_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_2_config:
    joint_dropout_prob: 0.5
    min_dropped_joints: 1
    max_dropped_joints: 1
    sensor_noise_std: 0.0
    ankle_focus_mode: true  # Prioritize ankle failures
  phase_3_config:
    joint_dropout_prob: 0.6
    min_dropped_joints: 1
    max_dropped_joints: 2
    sensor_noise_std: 0.0

total_timesteps: 32000000
save_freq: 1000000

ppo:
  learning_rate: 0.0001
  batch_size: 1536
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.15
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.4

policy:
  activation: tanh
  hidden_sizes: [128, 128]

reward_config:
  use_modified_reward: true
  survival_bonus: 0.5
  speed_weight: 1.5
  mastery_bonus: 100.0

num_envs: 8
seed: 42

logging:
  wandb: true
  wandb_project: robust-quadruped-rl
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_tags: ["v7.8a", "ankle-specialist", "weighted-sampling", "ultra-speed-base"]