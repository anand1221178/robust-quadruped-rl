

sr2l:
  enabled: true
  lambda: 0.0001                 
  perturbation_std: 0.01          
  apply_frequency: 1              
  velocity_adaptive: true        

  target_dimensions: "all"        
  warmup_steps: 500000            
  max_perturbation: 0.2           
  
  # Logging
  log_smoothness_metrics: true    # Track policy smoothness score
  save_action_trajectories: false # Save action sequences for analysis


learning_rate: 0.0003
n_steps: 2048
batch_size: 2048
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5


total_timesteps: 1000000          

save_freq: 50000
eval_freq: 10000