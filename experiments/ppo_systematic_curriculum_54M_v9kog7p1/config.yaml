algorithm: PPO
checkpoints:
  save_best: true
  save_freq: 1000000
  save_last: true
  save_phase_transitions: true
env:
  name: RealAntMujoco-v0
  use_success_reward: true
eval_freq: 500000
evaluation:
  deterministic: true
  episodes: 10
  test_dual_combinations: true
  test_single_joints: true
  test_untrained_combinations: true
experiment:
  description: 'SYSTEMATIC CURRICULUM: Guaranteed joint failure training with anatomical/diagonal/functional
    patterns (54M steps)'
  name: ppo_systematic_curriculum_54M
logging:
  custom_metrics:
  - curriculum/current_phase
  - curriculum/current_subphase
  - curriculum/failed_joints
  - curriculum/pattern_type
  - curriculum/subphase_progress
  - curriculum/completion_percentage
  - performance/locomotion_speed
  - performance/baseline_retention
  - performance/adaptation_rate
  - performance/stability_metric
  - biomech/gait_asymmetry
  - biomech/joint_utilization
  - biomech/energy_efficiency
  - joints/active_joint_count
  - joints/failed_joint_count
  - joints/compensation_pattern
  log_interval: 100
  tensorboard: true
  verbose: 1
  wandb: true
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_project: robust-quadruped-rl-systematic
num_envs: 8
policy:
  activation: relu
  hidden_sizes:
  - 64
  - 128
ppo:
  batch_size: 2048
  clip_range: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 5.0e-05
  max_grad_norm: 0.5
  n_epochs: 10
  vf_coef: 0.5
pretrained_model: done/ppo_baseline_ueqbjf2x/best_model/best_model.zip
pretrained_vec_normalize: done/ppo_baseline_ueqbjf2x/vec_normalize.pkl
research:
  expected_outcomes:
  - Single joint adaptation strategies for all 8 joints
  - Pattern-specific adaptation for anatomical/diagonal/functional failures
  - Generalization to untrained joint combinations
  - Superior performance vs. probabilistic DR training
  hypothesis: Systematic joint failure training will achieve 60-80% baseline retention
    for single joints, 40-60% for dual combinations
  success_criteria:
  - 'Phase 1: >60% retention for all single joints'
  - 'Phase 2: >40% retention for all dual combinations'
  - 'Generalization: >30% retention on untested combinations'
  - 'Consistency: <20% standard deviation across trials'
save_freq: 1000000
seed: 42
systematic_curriculum:
  anatomical_combinations:
  - - hip_1
    - ankle_1
  - - hip_2
    - ankle_2
  - - hip_3
    - ankle_3
  - - hip_4
    - ankle_4
  critical_triple_combinations: []
  diagonal_combinations:
  - - hip_1
    - hip_4
  - - hip_2
    - hip_3
  dual_combo_duration: 3000000
  enabled: true
  functional_combinations:
  - - hip_1
    - hip_2
  - - hip_3
    - hip_4
  - - ankle_1
    - ankle_2
  - - ankle_3
    - ankle_4
  single_joint_duration: 3000000
  triple_combo_duration: 0
  wrapper_type: SystematicCurriculumWrapper
total_timesteps: 54000000
training:
  adaptation_analysis: true
  curriculum_logging: true
  curriculum_warmup: 100000
  freeze_value_function: false
  patience: 2000000
  performance_threshold: 0.1
