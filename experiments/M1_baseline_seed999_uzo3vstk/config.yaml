eval_freq: 10000
experiment:
  description: Baseline PPO (no robustness training) (seed=999)
  name: M1_baseline_seed999
logging:
  log_interval: 10
  tensorboard: true
  verbose: 1
  wandb: true
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_project: robust-quadruped-rl-multiseed
  wandb_tags:
  - M1_baseline
  - seed999
  - multiseed_experiment
