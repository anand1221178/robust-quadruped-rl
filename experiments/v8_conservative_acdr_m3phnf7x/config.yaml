cluster:
  cpus: 16
  gpu: true
  memory: 32GB
  time_limit: '72:00:00'
env:
  name: RealAntMujoco-v0
  use_domain_randomization: true
  use_success_reward: true
  v8_enhanced_acdr:
    adaptation_rewards:
      adaptation_bonus: 30.0
      base_forward: 100.0
      efficiency_bonus: 20.0
      gait_discovery_bonus: 50.0
      stability_bonus: 20.0
    ankle_specialization:
      ankle_adaptation_bonus: 30.0
      ankle_reward_multiplier: 1.5
      enabled: true
      phase_1_ankle_focus: 0.2
    curriculum_phases:
      phase_1:
        duration_steps: 20000000
        episode_length: 500
        failure_probability: 0.5
        joint_patterns:
        - single_joint
        k_range:
        - 0.8
        - 0.4
        name: Single Joint Mastery - Conservative
      phase_2:
        duration_steps: 20000000
        episode_length: 750
        failure_probability: 0.4
        joint_patterns:
        - dual_adjacent
        - dual_diagonal
        k_range:
        - 0.6
        - 0.2
        name: Dual Joint Compensation - Conservative
      phase_3:
        duration_steps: 20000000
        episode_length: 1000
        failure_probability: 0.3
        joint_patterns:
        - sequential_failure
        k_range:
        - 0.8
        - 0.0
        name: Sequential Dynamic Adaptation - Conservative
    failure_injection:
      adaptation_grace_period: 300
      dynamic_failures: true
      failure_announcement: true
    total_timesteps: 60000000
  wrapper_type: V8EnhancedACDRWrapper
eval_freq: 10000
experiment:
  description: 'V8 Conservative ACDR: Gentler adaptation-focused learning with stable
    progression'
  name: v8_conservative_acdr
  tags:
  - v8
  - conservative
  - acdr
  - stable
  - adaptation
logging:
  log_interval: 10
  tensorboard: true
  verbose: 1
  wandb: true
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_project: V8_Conservative_ACDR
num_envs: 8
policy:
  activation: tanh
  hidden_sizes:
  - 64
  - 128
ppo:
  batch_size: 2048
  clip_range: 0.2
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0003
  max_grad_norm: 0.5
  n_epochs: 10
  vf_coef: 0.5
research_notes: "V8 Conservative ACDR Goals:\n\nGENTLER APPROACH to V8 Enhanced:\n\
  - Shorter episodes (500-1000 vs 1000-1500) for stable learning\n- Lower failure\
  \ rates (30-50% vs 60-80%) for less aggressive training\n- Reduced ankle focus (20%\
  \ vs 40%) to avoid overwhelming early learning\n- Smaller reward bonuses to avoid\
  \ destabilizing base locomotion\n\nExpected vs V8 Enhanced:\n- More stable training\
  \ progression\n- Better baseline locomotion preservation\n- Gentler adaptation learning\
  \ curve\n- Higher success probability\n\nTarget Improvements over V7:\n- Ankle retention:\
  \ 19.9-33.9% \u2192 40%+ (vs V8's 50%+ target)\n- Overall success: 77% \u2192 80%+\
  \ (vs V8's 85%+ target)\n- Baseline speed: Maintain 0.18+ m/s with better adaptation\
  \ than V7"
save_freq: 50000
seed: 42
success_criteria:
  target_adaptation_improvement: 0.2
  target_ankle_retention: 0.4
  target_baseline_velocity: 0.18
  target_joint_failure_retention: 0.5
total_timesteps: 60000000
training:
  eval_episodes: 10
  eval_freq: 2000000
  max_episode_steps: 1000
  min_improvement: 0.01
  patience: 10000000
  save_freq: 1000000
wandb:
  custom_metrics:
  - curriculum_phase
  - current_k_value
  - joint_failure_pattern
  - adaptation_reward_bonus
  - ankle_specialization_active
  - sequential_failure_count
  - episode_velocity_improvement
  enabled: true
  entity: anandpatel1221178-university-of-the-witswatersrand
  log_frequency: 1000
  project: V8_Conservative_ACDR
  tags:
  - v8
  - conservative
  - acdr
  - stable
  - gentle
