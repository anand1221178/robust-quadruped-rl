domain_randomization:
  enabled: true
  phase_1_config:
    joint_dropout_prob: 0.0
    max_dropped_joints: 0
    min_dropped_joints: 0
    sensor_noise_std: 0.0
  phase_1_steps: 10000000
  phase_2_config:
    joint_dropout_prob: 0.5
    max_dropped_joints: 1
    min_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_2_steps: 10000000
  phase_3_config:
    joint_dropout_prob: 0.6
    max_dropped_joints: 2
    min_dropped_joints: 1
    sensor_noise_std: 0.0
  phase_3_steps: 10000000
  wrapper_type: CurriculumDRWrapper
env:
  backward_penalty_multiplier: 5.0
  name: RealAntMujoco-v0
  speed_bonus_multiplier: 3.0
  speed_bonus_threshold: 0.1
  target_velocity: 0.15
  use_backward_penalty: true
  use_domain_randomization: true
  use_success_reward: true
  use_ultra_speed_mode: true
  velocity_retention_bonus: true
eval_episodes: 10
eval_freq: 1000000
experiment:
  description: 'VecNormalize Ablation: PPO + SR2L + DR WITHOUT VecNormalize - Testing
    combined methods without normalization'
  name: ppo_combo_no_vecnorm
  tags:
  - vecnormalize_ablation
  - sr2l
  - domain_randomization
  - no_normalization
  - combined_methods
  - ablation_study
log_freq: 10000
logging:
  log_interval: 10
  tensorboard: true
  verbose: 1
  wandb: true
  wandb_entity: anandpatel1221178-university-of-the-witswatersrand
  wandb_project: robust-quadruped-rl
num_envs: 8
policy:
  activation: tanh
  hidden_sizes:
  - 128
  - 128
ppo:
  batch_size: 1536
  clip_range: 0.15
  ent_coef: 0.005
  gae_lambda: 0.97
  gamma: 0.995
  learning_rate: 0.0001
  max_grad_norm: 0.4
  n_epochs: 8
  vf_coef: 0.5
reward_config:
  mastery_bonus: 100.0
  speed_weight: 1.5
  survival_bonus: 0.5
  use_modified_reward: true
save_freq: 1000000
seed: 42
sr2l:
  curriculum_steps: 15000000
  enabled: true
  joint_end_dim: 28
  joint_start_dim: 13
  lambda_smooth: 0.001
  max_perturbation: 0.05
  perturb_only_joints: true
  perturbation_std: 0.01
  use_curriculum: true
  warmup_steps: 5000000
total_timesteps: 30000000
vec_normalize:
  enabled: false
wandb:
  enabled: true
  entity: anandpatel_patel_robust_rl_research
  name: ppo_combo_no_vecnorm
  project: robust-quadruped-rl
  tags:
  - vecnorm_ablation
  - sr2l_dr_combo
  - no_normalization
